<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase মেম্বার এক্সপোর্ট</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#111}
  h1{font-size:20px}
  label{display:block;margin:12px 0 4px;font-size:14px}
  input[type=email],input[type=password]{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px;box-sizing:border-box}
  button{margin-top:16px;padding:12px 18px;font-size:16px;border:0;border-radius:8px;background:#0a7d4b;color:#fff}
  button:disabled{opacity:.5}
  #log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px;background:#f4f4f4;border-radius:8px;padding:10px;margin-top:16px;min-height:60px}
  .note{font-size:13px;color:#555}
</style>
</head>
<body>
<h1>Firebase মেম্বার এক্সপোর্ট</h1>
<p class="note">আপনার পুরনো Firebase অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে ঢুকুন। এই পেজ শুধু মেম্বারদের নাম, ফোন ও ইমেইল পড়ে (ব্যালেন্স বা অন্য কিছু নয়) একটা ফাইলে (<b>members.json</b>) নামিয়ে দেবে। পাসওয়ার্ড কোথাও সেভ বা পাঠানো হয় না।</p>

<label>অ্যাডমিন ইমেইল</label>
<input id="em" type="email" autocomplete="username" value="hemelbala84@gmail.com">
<label>পাসওয়ার্ড (Firebase এর)</label>
<input id="pw" type="password" autocomplete="current-password">
<button id="go">এক্সপোর্ট শুরু করুন</button>
<div id="log">অপেক্ষা করছি…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
  authDomain: "apexify-72bc2.firebaseapp.com",
  projectId: "apexify-72bc2",
  storageBucket: "apexify-72bc2.firebasestorage.app",
  messagingSenderId: "114061131405",
  appId: "1:114061131405:web:2e82e5dbdbf23ea4976cc4"
});
const auth = getAuth(app);
const db = getFirestore(app);

const COLLECTIONS = ['users'];

const logEl = document.getElementById('log');
const log = m => { logEl.textContent += '\n' + m; };

// Firestore dates -> text dates
function clean(v){
  if(v === null || v === undefined) return v;
  if(typeof v.toDate === 'function') return v.toDate().toISOString();
  if(Array.isArray(v)) return v.map(clean);
  if(typeof v === 'object'){
    if('latitude' in v && 'longitude' in v && Object.keys(v).length <= 3) return { latitude:v.latitude, longitude:v.longitude };
    const o = {}; for(const k of Object.keys(v)) o[k] = clean(v[k]); return o;
  }
  return v;
}
const KEEP = ['name','phone','email','userId','referralId','referrerUid','status','createdAt'];
async function readAll(path){
  const snap = await getDocs(collection(db, ...path.split('/')));
  return snap.docs.map(d => {
    const all = clean(d.data()), data = {};
    KEEP.forEach(k => { if(all[k] !== undefined) data[k] = all[k]; });   // balances and everything else are NOT exported
    return { id:d.id, data };
  });
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true; logEl.textContent = 'লগইন হচ্ছে…';
  try{
    await signInWithEmailAndPassword(auth, document.getElementById('em').value.trim(), document.getElementById('pw').value);
  }catch(e){
    log('❌ লগইন হয়নি: ' + (e.code || e.message)); btn.disabled = false; return;
  }
  log('✅ লগইন হয়েছে');
  const out = { exportedAt:new Date().toISOString(), project:'apexify-72bc2', collections:{}, errors:{} };
  for(const c of COLLECTIONS){
    try{
      out.collections[c] = await readAll(c);
      log(c + ': ' + out.collections[c].length + 'টা');
    }catch(e){
      out.errors[c] = e.code || e.message;
      log('⚠️ ' + c + ' পড়া যায়নি (' + (e.code || e.message) + ')');
    }
  }
  const users = out.collections.users || [];
  const blob = new Blob([JSON.stringify(out)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'members.json';
  document.body.appendChild(a); a.click(); a.remove();
  log('\n✅ শেষ! members.json ফাইলটা ডাউনলোড হয়েছে (সাইজ ' + Math.round(blob.size / 1024) + ' KB)।');
  btn.disabled = false;
};
</script>
</body>
</html>
