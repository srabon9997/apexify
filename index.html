<style>
  :root{
    --bg:#F7F9FC;
    --card:#FFFFFF;
    --primary:#10B981;
    --primary-dark:#064E3B;
    --accent:#10B981;
    --accent-soft:#D1FAE5;
    --dark-card-1:#053B2C;
    --dark-card-2:#0B6B4F;
    --text:#0F172A;
    --text-mute:#64748B;
    --border:#E2E8F0;
    --danger:#EF4444;
    --danger-soft:#FEE2E2;
    --warning:#F59E0B;
    --warning-soft:#FEF3C7;
    --ok-soft:#D1FAE5;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-btn:12px;
    --radius-pill:999px;
    --shadow:0 12px 28px rgba(15,23,42,0.07);
    --shadow-sm:0 4px 20px rgba(15,23,42,0.04);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:#EEF1F6; font-family:'Inter',sans-serif; color:var(--text);
    display:flex; justify-content:center;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
  #phone{
    width:100%; max-width:430px; min-height:100vh; background:var(--bg);
    position:relative; overflow-x:hidden; display:flex; flex-direction:column;
  }
  ::-webkit-scrollbar{display:none;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:var(--radius-btn); padding:14px 20px; font-weight:600;
    font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, opacity .15s ease, box-shadow .2s ease, filter .15s ease, background .15s ease;
    position:relative; min-height:44px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(16,185,129,.22);}
  .btn-primary:hover{background:#0DA271; box-shadow:0 6px 16px rgba(16,185,129,.28);}
  .btn-primary:active{background:#0A8A5F; box-shadow:0 2px 8px rgba(16,185,129,.3);}
  .btn-outline{background:#fff; color:var(--primary-dark); border:1.5px solid var(--border); transition:all .15s ease;}
  .btn-outline:hover{border-color:var(--primary); background:var(--accent-soft);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px; font-size:13px; min-height:38px;}
  .btn:disabled{opacity:.6; pointer-events:none;}
  .btn-spin{
    width:18px; height:18px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:btnspin .7s linear infinite; flex-shrink:0;
  }
  .btn-outline .btn-spin, .btn-ghost .btn-spin{
    border:2.5px solid rgba(0,0,0,.15); border-top-color:var(--primary-dark);
  }
  @keyframes btnspin{to{transform:rotate(360deg);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner{border:3px solid rgba(16,185,129,.15); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite;}

  /* ---------- Auth ---------- */
  #auth-screen{flex:1; display:flex; flex-direction:column; padding:34px 24px 24px;}
  .auth-logo{display:flex; align-items:center; gap:10px; margin-bottom:36px;}
  .auth-logo .mark{width:42px; height:42px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .auth-logo .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .auth-logo .name{font-weight:800; font-size:19px; letter-spacing:-.2px;}
  .auth-title{font-size:26px; font-weight:800; margin:0 0 6px; letter-spacing:-.3px;}
  .auth-sub{color:var(--text-mute); font-size:14.5px; margin:0 0 28px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-mute); margin-bottom:7px; letter-spacing:.2px;}
  .field-input{
    display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--border);
    border-radius:var(--radius-btn); padding:13px 15px;
  }
  .field-input:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px rgba(16,185,129,.12);}
  .field-input input{border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--text);}
  .field-input svg{flex-shrink:0;}
  .dep-method-grid{display:flex; gap:10px; margin-bottom:16px;}
  .dep-method-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 6px; border:1.5px solid var(--border); border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s;}
  .dep-method-item.active{border-color:var(--primary); background:rgba(16,185,129,.06);}
  .dep-method-logo{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  .dep-method-item span{font-size:11.5px; font-weight:700; color:var(--text);}
  .dep-number-box{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .dep-number-box b{font-size:16px; letter-spacing:.4px;}
  .eye-toggle{background:none; border:none; padding:2px; display:flex; color:var(--text-mute);}
  .row-between{display:flex; align-items:center; justify-content:space-between; margin:4px 0 22px;}
  .remember{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-mute);}
  .link{color:var(--primary-dark); font-weight:700; font-size:13.5px; text-decoration:none;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--text-mute); font-size:12.5px; margin:22px 0;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
  .social-row{display:flex; gap:10px;}
  .social-btn{flex:1; background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-btn); padding:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:13.5px; transition:border-color .15s ease, background .15s ease;}
  .social-btn:active{transform:scale(0.97);}
  .social-btn:hover{border-color:var(--primary);}
  .auth-switch{text-align:center; margin-top:24px; font-size:14px; color:var(--text-mute);}
  .err-msg{color:var(--danger); font-size:12.5px; font-weight:600; margin-top:6px; min-height:16px;}

  /* ---------- App shell ---------- */
  #app-shell{flex:1; display:flex; flex-direction:column;}
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--bg); padding:16px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:34px; height:34px; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand .mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand .name{font-weight:800; font-size:16px; letter-spacing:-.2px;}
  .top-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:40px; height:40px; border-radius:var(--radius-btn); background:#fff; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; position:relative; color:var(--text);
    transition:border-color .15s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:hover{border-color:var(--primary);}
  .badge-dot{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--danger); border:2px solid var(--bg);}

  main{flex:1; padding:4px 18px 100px; overflow-y:auto;}
  .screen-title{font-size:20px; font-weight:800; margin:6px 0 16px; letter-spacing:-.3px;}
  .back-row{display:flex; align-items:center; gap:10px; margin:6px 0 16px;}
  .back-btn{width:36px; height:36px; border-radius:var(--radius-btn); background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}

  /* ---------- Bottom nav ---------- */
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:#fff; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom)); z-index:30;
  }
  .nav-item{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-mute); font-size:10.5px; font-weight:600; flex:1; padding:6px 0;
    transition:color .15s ease;
  }
  .nav-item:active{transform:scale(0.94);}
  .nav-item.active{color:var(--primary-dark);}
  .nav-fab{
    width:52px; height:52px; border-radius:50%; background:var(--primary);
    display:flex; align-items:center; justify-content:center; color:#fff; margin-top:-24px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 18px rgba(16,185,129,.32); border:4px solid var(--bg); flex-shrink:0;
  }
  .nav-fab:active{transform:scale(0.93);}

  #channel-fab{
    position:fixed; right:16px; bottom:92px; z-index:32;
    width:50px; height:50px; border-radius:50%; border:none;
    background:var(--primary-dark); color:#fff; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #channel-fab:active{transform:scale(0.94);}

  /* ---------- Cards / dashboard ---------- */
  .banner{
    border-radius:var(--radius-lg); background:var(--primary-dark);
    color:#fff; padding:20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .banner h3{margin:0 0 4px; font-size:16.5px; font-family:'Plus Jakarta Sans';}
  .banner p{margin:0; font-size:12.5px; opacity:.8; max-width:75%;}
  .banner .glow{position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.06);}

  .action-card{
    display:flex; align-items:center; gap:12px; background:var(--warning-soft); border:1px solid #FDE4A8;
    border-radius:var(--radius-md); padding:13px 14px; margin-bottom:14px;
  }
  .action-card .txt{flex:1;}
  .action-card .txt b{display:block; font-size:13.5px; margin-bottom:2px;}
  .action-card .txt span{font-size:12px; color:var(--text-mute);}

  .status-strip{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 14px; margin-bottom:14px;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--primary);}
  .status-strip.inactive .status-dot{background:var(--danger);}
  .status-strip .stxt{flex:1; font-size:13.5px; font-weight:600;}
  .chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:var(--radius-pill);}
  .chip.ok{background:var(--ok-soft); color:var(--primary-dark);}
  .chip.warn{background:var(--warning-soft); color:var(--warning);}
  .chip.bad{background:var(--danger-soft); color:var(--danger);}

  .asset-card{
    border-radius:var(--radius-lg); background:linear-gradient(170deg,var(--dark-card-2),var(--dark-card-1));
    color:#fff; padding:22px 20px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .asset-card .lbl{font-size:12px; color:#A7D9C4; display:flex; align-items:center; justify-content:space-between;}
  .asset-card .val{font-size:30px; font-weight:800; font-family:'Plus Jakarta Sans'; margin:8px 0 16px; letter-spacing:-.4px;}
  .asset-card .sub-balances{display:flex; gap:10px;}
  .mini-bal{flex:1; background:rgba(255,255,255,.09); border-radius:var(--radius-md); padding:10px 12px;}
  .mini-bal span{display:block; font-size:10.5px; color:#A7D9C4; margin-bottom:4px;}
  .mini-bal b{font-size:14px; font-family:'Plus Jakarta Sans';}
  .currency-pill{background:rgba(255,255,255,.14); border:none; color:#fff; font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--radius-pill); display:flex; align-items:center; gap:4px;}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
  .stat-card span{font-size:11.5px; color:var(--text-mute); font-weight:600;}
  .stat-card b{display:block; font-size:18px; margin-top:4px; font-family:'Plus Jakarta Sans';}
  .stat-card b.up{color:var(--primary-dark);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px;}
  .section-head h3{font-size:15px; margin:0; font-family:'Plus Jakarta Sans'; font-weight:700;}
  .section-head .see-all{font-size:12.5px; font-weight:700; color:var(--primary-dark); background:none; border:none;}

  .services-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:6px;}
  .svc-item{display:flex; flex-direction:column; align-items:center; gap:7px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 4px; text-align:center; transition:border-color .15s ease;}
  .svc-item:active{transform:scale(0.96);}
  .svc-item:hover{border-color:var(--primary);}
  .svc-item .ic{width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center;}
  .svc-item span{font-size:10.5px; font-weight:600; line-height:1.2;}

  .earn-item{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 13px; margin-bottom:9px;}
  .earn-item .ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .earn-item .ic.plus{background:var(--ok-soft); color:var(--primary-dark);}
  .earn-item .ic.minus{background:var(--danger-soft); color:var(--danger);}
  .earn-item .body{flex:1; min-width:0;}
  .earn-item .body b{display:block; font-size:13.5px;}
  .earn-item .body span{font-size:11.5px; color:var(--text-mute);}
  .earn-item .amt{font-size:14px; font-weight:800; font-family:'Plus Jakarta Sans';}
  .amt.plus{color:var(--primary-dark);} .amt.minus{color:var(--danger);}

  .ranker-row{display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:11px 13px; margin-bottom:9px;}
  .rank-no{width:26px; height:26px; border-radius:50%; background:var(--ok-soft); color:var(--primary-dark); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .rank-no.gold{background:var(--warning-soft); color:var(--warning);}
  .avatar{width:34px; height:34px; border-radius:50%; background:var(--primary-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
  .ranker-row .body{flex:1;}
  .ranker-row .body b{display:block; font-size:13.5px;}
  .ranker-row .body span{font-size:11.5px; color:var(--text-mute);}

  .partners-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .partner-chip{flex-shrink:0; background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 16px; font-weight:700; font-size:13px; color:var(--text);}

  /* ---------- Generic list / detail card ---------- */
  .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .kv-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row span{color:var(--text-mute);}
  .kv-row b{font-weight:700;}

<script id="apx-load-guard">
/* ===== Load guard (members): fewer, calmer requests =====
   - no time limit on requests, at most 4 run at once, identical reads share one answer
   - a dropped connection or overloaded server is retried gently; writes are never repeated */
(function(){
  var MAX_PAR = 4, NET_RETRIES = 2, SLOW_RETRIES = 2;
  var active = 0, queue = [], inflight = new Map(), lastToast = 0;
  function pump(){ while(active < MAX_PAR && queue.length){ active++; queue.shift()(); } }
  function slot(){ return new Promise(function(res){ queue.push(res); pump(); }); }
  function release(){ active--; pump(); }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function failed(){
    window.__apxNetFail = Date.now();
    if(Date.now() - lastToast > 10000){
      lastToast = Date.now();
      try{ toast('সার্ভারে চাপ বেশি — একটু অপেক্ষা করে আবার চেষ্টা করুন'); }catch(e){}
    }
  }
  // identical GET requests that are already on their way share ONE answer (no duplicate work)
  function keyOf(input, init, method){
    if(method !== 'GET') return null;
    var url = typeof input === 'string' ? input : ((input && input.url) || '');
    try{
      var h = new Headers((init && init.headers) || (input && input.headers) || {}), parts = [];
      h.forEach(function(v, k){ if(k !== 'authorization' && k !== 'apikey' && k !== 'x-client-info') parts.push(k + ':' + v); });
      parts.sort();
      return url + '|' + parts.join(';');
    }catch(e){ return url; }
  }
  var SLOW_CODES = {429:1, 502:1, 503:1, 504:1};
  async function run(input, init, isRead){
    await slot();
    try{
      for(var attempt = 0; ; attempt++){
        try{
          var res = await fetch(input, init);          // no time limit: it waits as long as the server needs
          if(isRead && SLOW_CODES[res.status] && attempt < SLOW_RETRIES){ await sleep(4000 * (attempt + 1)); continue; }   // slow server: wait, then ask again gently
          if(res.status >= 500 || res.status === 429) failed();
          return res;
        }catch(e){
          var userAbort = init && init.signal && init.signal.aborted;
          if(isRead && !userAbort && attempt < NET_RETRIES){ await sleep(1200 * (attempt + 1)); continue; }   // plain network drop
          if(!userAbort) failed();
          throw e;
        }
      }
    } finally { release(); }
  }
  window.apxGuardedFetch = function(input, init){
    var url = typeof input === 'string' ? input : ((input && input.url) || '');
    var method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    if(url.indexOf('/auth/v1/') !== -1) return fetch(input, init);      // login & token refresh: untouched
    try{ if(localStorage.getItem('apx_guard_off') === '1') return fetch(input, init); }catch(e){}   // kill switch
    var isRead = (method === 'GET' || method === 'HEAD');
    var key = keyOf(input, init, method);
    if(key && inflight.has(key)) return inflight.get(key).then(function(r){ return r.clone(); });
    var p = run(input, init, isRead);
    if(!key) return p;                                                   // writes are never shared or repeated
    inflight.set(key, p);
    p.then(function(){ inflight.delete(key); }, function(){ inflight.delete(key); });
    return p.then(function(r){ return r.clone(); });
  };
})();
</script>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
/* ===================================================================
   Supabase compatibility layer
   Lets the existing site code keep using the same helper names
   (doc, getDoc, setDoc, runTransaction, signInWithEmailAndPassword ...)
   but talk to Supabase instead of Firebase.
   =================================================================== */
function createCompat(sb, cfg){
  const SB_URL = cfg.url, SB_KEY = cfg.key, mkClient = cfg.createClient;
  const PAGE = 1000;

  /* ---------- timestamps ---------- */
  const TS_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?(Z|[+-]\d\d:\d\d)$/;
  class Timestamp{
    constructor(ms){ this._ms = ms; }
    toDate(){ return new Date(this._ms); }
    toMillis(){ return this._ms; }
    get seconds(){ return Math.floor(this._ms/1000); }
    get nanoseconds(){ return (this._ms % 1000) * 1e6; }
    valueOf(){ return this._ms; }
    toJSON(){ return new Date(this._ms).toISOString(); }
    static fromDate(d){ return new Timestamp(d.getTime()); }
    static now(){ return new Timestamp(Date.now()); }
  }
  function revive(v){
    if(v === null || v === undefined) return v;
    if(typeof v === 'string'){
      if(v.length >= 20 && v.length <= 40 && TS_RE.test(v)){
        const ms = Date.parse(v); if(!isNaN(ms)) return new Timestamp(ms);
      }
      return v;
    }
    if(Array.isArray(v)) return v.map(revive);
    if(typeof v === 'object'){
      const o = {}; for(const k of Object.keys(v)) o[k] = revive(v[k]); return o;
    }
    return v;
  }
  function encode(v){
    if(v === null || v === undefined) return v === undefined ? undefined : null;
    if(v instanceof Timestamp) return new Date(v._ms).toISOString();
    if(v instanceof Date) return v.toISOString();
    if(Array.isArray(v)) return v.map(x => { const e = encode(x); return e === undefined ? null : e; });
    if(typeof v === 'object'){
      if(v.__fv === 'ts') return '__SERVER_TS__';
      const o = {}; for(const k of Object.keys(v)){ const e = encode(v[k]); if(e !== undefined) o[k] = e; } return o;
    }
    if(typeof v === 'function') return undefined;
    return v;
  }
  const serverTimestamp = () => ({ __fv:'ts' });
  const increment = n => ({ __fv:'inc', n:Number(n) });
  function splitPatch(obj){
    const data = {}, incs = {};
    for(const k of Object.keys(obj || {})){
      const v = obj[k];
      if(v && v.__fv === 'inc') incs[k] = v.n;
      else { const e = encode(v); if(e !== undefined) data[k] = e; }
    }
    return { data, incs };
  }

  /* ---------- errors ---------- */
  function dbErr(error){
    const msg = (error && error.message) || String(error);
    const e = new Error(msg);
    const code = (error && error.code) || '';
    if(code === '42501' || /row-level security|permission denied/i.test(msg)) e.code = 'permission-denied';
    else if(code === 'P0002' || /^not-found/.test(msg)) e.code = 'not-found';
    else if(code === '40001' || /tx-conflict/.test(msg)) e.code = 'aborted';
    else if(/Failed to fetch|NetworkError|Load failed/i.test(msg)) e.code = 'unavailable';
    else e.code = code || 'unknown';
    e.details = error && error.details; e.hint = error && error.hint;
    return e;
  }
  function authErr(error){
    const msg = String((error && error.message) || '').toLowerCase();
    const raw = (error && (error.code || error.error_code)) || '';
    const e = new Error((error && error.message) || 'Auth error');
    let code = 'auth/internal-error';
    if(raw === 'user_already_exists' || /already registered|already been registered/.test(msg)) code = 'auth/email-already-in-use';
    else if(raw === 'invalid_credentials' || /invalid login|invalid credentials/.test(msg)) code = 'auth/invalid-credential';
    else if(raw === 'weak_password' || /password should be|weak password/.test(msg)) code = 'auth/weak-password';
    else if(raw === 'email_address_invalid' || /email address .* is invalid|invalid email/.test(msg)) code = 'auth/invalid-email';
    else if(error && error.status === 429 || /rate limit|too many/.test(msg)) code = 'auth/too-many-requests';
    else if(/failed to fetch|network|load failed/.test(msg)) code = 'auth/network-request-failed';
    else if(raw === 'signup_disabled') code = 'auth/operation-not-allowed';
    else if(raw === 'email_not_confirmed' || /email not confirmed/.test(msg)) code = 'auth/email-not-confirmed';
    e.code = code; e.originalMessage = error && error.message;
    return e;
  }

  /* ---------- paths / refs ---------- */
  const KEYCOL = { docs:'id', profiles:'uid', publicProfiles:'id', admins:'uid', settings:'key' };
  const TABLE  = { docs:'docs', profiles:'profiles', publicProfiles:'publicProfiles', admins:'admins', settings:'settings' };
  const TYPED = {
    profiles: new Set(['uid','name','phone','email','userId','referralId','referrerUid','referralRewarded','status','activatedAt','lastDailyCredit','totalRevenue','mainBalance','salaryBalance','referralBalance','depositBalance','referralCount','completedTaskIds','bkashNumber','bkashVerified','nagadNumber','nagadVerified','hasPurchasedPackage','currency','banned','gmailCreateUnlocked','gmailDaily','lastCreditRef','createdAt','updatedAt']),
    publicProfiles: new Set(['id','name','userId','referralId','referrerUid','status','referralCount','createdAt']),
    admins: new Set(['uid','active','email','isOwner','createdAt','updatedAt'])
  };
  function newId(){
    const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const a = new Uint8Array(20); (self.crypto || window.crypto).getRandomValues(a);
    let s = ''; for(const x of a) s += c[x % c.length]; return s;
  }
  function parseSegs(segs){
    const [a, b, c, d] = segs;
    const isCol = segs.length % 2 === 1;
    if(a === 'users'){
      if(segs.length <= 2) return { table:'profiles', coll:'users', scope:null, id:b, kind:isCol?'col':'doc' };
      const sub = c === 'notifications' ? 'userNotifications' : c === 'wallets' ? 'userWallets' : null;
      if(!sub) throw new Error('Unsupported path: ' + segs.join('/'));
      return { table:'docs', coll:sub, scope:b, id:d, kind:isCol?'col':'doc' };
    }
    if(a === 'publicProfiles') return { table:'publicProfiles', coll:a, scope:null, id:b, kind:isCol?'col':'doc' };
    if(a === 'admins')         return { table:'admins',         coll:a, scope:null, id:b, kind:isCol?'col':'doc' };
    if(a === 'settings')       return { table:'settings',       coll:a, scope:null, id:b, kind:isCol?'col':'doc' };
    return { table:'docs', coll:a, scope:null, id:b, kind:isCol?'col':'doc' };
  }
  function collection(db, ...segs){
    if(segs.length % 2 === 0) throw new Error('collection() needs an odd number of path segments');
    return { __t:'col', ...parseSegs(segs), where:[], order:[], limit:null, cursor:null };
  }
  function doc(base, ...segs){
    if(base && base.__t === 'col'){            // doc(collectionRef [, id])
      return { ...base, __t:'doc', kind:'doc', id: segs[0] || newId(), where:undefined, order:undefined };
    }
    if(segs.length % 2 === 1) throw new Error('doc() needs an even number of path segments');
    return { __t:'doc', ...parseSegs(segs) };
  }

  /* ---------- row <-> data ---------- */
  function rowToData(table, row){
    if(!row) return undefined;
    if(table === 'docs'){
      const d = revive(row.data || {});
      if(d.createdAt === undefined && row.createdAt) d.createdAt = revive(row.createdAt);
      return d;
    }
    if(table === 'settings') return revive(row.data || {});
    const { extra, ...rest } = row;
    return { ...revive(extra || {}), ...revive(rest) };
  }
  function mkSnap(ref, row){
    const ex = !!row;
    return {
      id: ref.id, ref, __row: row || null, __ver: row ? (row.updatedAt || null) : null,
      exists: () => ex,
      data: () => ex ? rowToData(ref.table, row) : undefined,
      get: f => ex ? getPath(rowToData(ref.table, row), f) : undefined
    };
  }
  function getPath(o, path){
    let cur = o; for(const p of String(path).split('.')){ if(cur == null) return undefined; cur = cur[p]; } return cur;
  }

  /* ---------- reading ---------- */
  function norm(v){
    if(v instanceof Timestamp) return v._ms;
    if(v instanceof Date) return v.getTime();
    return v;
  }
  function cmpVals(a, b){
    a = norm(a); b = norm(b);
    if(typeof a === 'number' && typeof b === 'number') return a - b;
    if(typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;
    if(typeof a === 'boolean' && typeof b === 'boolean') return (a?1:0) - (b?1:0);
    return String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
  }
  function matchWhere(data, w){
    const a = getPath(data, w.field), b = w.value;
    switch(w.op){
      case '==': return a !== undefined && (a === null || b === null ? a === b : cmpVals(a, b) === 0);
      case '!=': return a !== undefined && !(a === null || b === null ? a === b : cmpVals(a, b) === 0);
      case '<':  return a != null && cmpVals(a, b) < 0;
      case '<=': return a != null && cmpVals(a, b) <= 0;
      case '>':  return a != null && cmpVals(a, b) > 0;
      case '>=': return a != null && cmpVals(a, b) >= 0;
      case 'in': return Array.isArray(b) && b.some(x => a !== undefined && cmpVals(a, x) === 0);
      case 'not-in': return a !== undefined && Array.isArray(b) && !b.some(x => cmpVals(a, x) === 0);
      case 'array-contains': return Array.isArray(a) && a.some(x => cmpVals(x, b) === 0);
      case 'array-contains-any': return Array.isArray(a) && Array.isArray(b) && a.some(x => b.some(y => cmpVals(x, y) === 0));
    }
    return true;
  }
  const SAFE = /^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$/;
  function jsonCol(field){
    const parts = field.split('.');
    return 'data' + parts.slice(0, -1).map(p => '->' + p).join('') + '->>' + parts[parts.length - 1];
  }
  const iso = v => { v = norm(v); return typeof v === 'number' ? new Date(v).toISOString() : v; };
  // returns { col, op, val } for a filter PostgREST can run, or null (then done in the browser)
  function serverWhere(q, w){
    const f = w.field, op = w.op, v = w.value;
    const time = (f === 'createdAt' || f === 'updatedAt');
    let col = null, val = v, kind = 'col';
    if(q.table === 'docs'){
      if(f === 'uid') col = 'uid';
      else if(f === 'id' || f === '__name__') col = 'id';
      else if(time && ['==','<','<=','>','>='].includes(op)){ col = f; val = iso(v); }
      else if(SAFE.test(f) && (op === '==' || op === 'in')){ col = jsonCol(f); kind = 'json'; }
    }else if(TYPED[q.table] && TYPED[q.table].has(f)){
      col = f; if(time) val = iso(v);
    }
    if(!col) return null;
    if(op === '==' ){
      if(val === null) return { col, op:'is', val:null };
      return { col, op:'eq', val: kind === 'json' ? String(val) : (time ? val : val) };
    }
    if(op === 'in'){
      if(!Array.isArray(val) || !val.length || val.length > 30) return null;
      return { col, op:'in', val: kind === 'json' ? val.map(String) : val };
    }
    if(kind === 'json') return null;
    if(op === '<')  return { col, op:'lt',  val };
    if(op === '<=') return { col, op:'lte', val };
    if(op === '>')  return { col, op:'gt',  val };
    if(op === '>=') return { col, op:'gte', val };
    return null;
  }
  function serverOrder(q, o){
    const f = o.field;
    if(f === 'createdAt' || f === 'updatedAt') return f;
    if(q.table === 'docs') return (f === 'uid' || f === 'id') ? f : null;
    if(TYPED[q.table] && TYPED[q.table].has(f)) return f;
    return null;
  }
  function applyWhere(b, s){
    if(s.op === 'eq') return b.eq(s.col, s.val);
    if(s.op === 'is') return b.is(s.col, null);
    if(s.op === 'in') return b.in(s.col, s.val);
    return b[s.op](s.col, s.val);
  }
  function planQuery(q){
    const plan = { server:[], clientWhere:[], serverOrder:[], clientOrder:[], cursorServer:null, cursorClient:null };
    for(const w of q.where){
      const s = serverWhere(q, w);
      if(s) plan.server.push(s); else plan.clientWhere.push(w);
    }
    let allServerOrder = true;
    for(const o of q.order){ if(!serverOrder(q, o)) allServerOrder = false; }
    if(allServerOrder) plan.serverOrder = q.order.map(o => ({ col:serverOrder(q, o), asc:o.dir !== 'desc' }));

  const m = Math.floor(s/60);
  if(m < 60) return `${m} min ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  const dday = Math.floor(h/24);
  if(dday === 1) return 'Yesterday';
  if(dday < 7) return `${dday}d ago`;
  return date.toLocaleDateString('en-US');
}

/* ---------- টাইমড ব্যান: bannedUntil (ms) পার হলে ব্যান আর কার্যকর না ---------- */
function isBanActive(u){
  if(!u || u.banned !== true) return false;
  const t = Number(u.bannedUntil||0);
  return !t || t > Date.now();
}
let __banTimer = null;
function showBanCountdown(until){

  const toBn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const render = () => {
    const left = until - Date.now();
    if(left <= 0){
      clearInterval(__banTimer);
      ov.innerHTML = `<div class="apx-ban"><div class="apx-ban-ic ok"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>

      </div>`;
      document.getElementById('ban-ok-btn').onclick = () => ov.remove();
      return;
    }
    let sec = Math.floor(left/1000);
    const d = Math.floor(sec/86400); sec %= 86400;
    const h = Math.floor(sec/3600); sec %= 3600;
    const m = Math.floor(sec/60); sec %= 60;
    const box = (v,l) => `<div class="apx-ban-box"><b>${toBn(String(v).padStart(2,'0'))}</b><small>${l}</small></div>`;
    ov.innerHTML = `<div class="apx-ban"><div class="apx-ban-ic warn"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h3>অ্যাকাউন্ট সাময়িক ব্যান</h3>
      <p>সময় শেষ হলে অ্যাকাউন্ট নিজে থেকেই ঠিক হয়ে যাবে। তারপর আবার লগইন করতে পারবেন।</p>
      <div class="apx-ban-timer">${d?box(d,'দিন'):''}${box(h,'ঘণ্টা')}${box(m,'মিনিট')}${box(sec,'সেকেন্ড')}</div>
      <button id="ban-close-btn" class="apx-ban-btn ghost">বন্ধ করুন</button>
    </div>`;
    document.getElementById('ban-close-btn').onclick = () => { clearInterval(__banTimer); ov.remove(); };
  };
  render();
  __banTimer = setInterval(render, 1000);
}

// Login fires both doLogin() and onAuthStateChanged() — they used to run two
// complete loads in parallel. Concurrent callers now share ONE load.
let __lcuPromise = null;
function loadCurrentUser(force){
  if(__lcuPromise) return __lcuPromise;
  __lcuPromise = _loadCurrentUser(force).finally(()=>{ __lcuPromise = null; });
  return __lcuPromise;
}
async function _loadCurrentUser(force){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return false;

  await loadFirebaseSettings(!!force);
  const uid = fb.auth.currentUser.uid;
  let userData;
  try{
    const snap = await fb.getDoc(fb.doc(fb.db,'users',uid));
    if(!snap.exists()){
      toast('Account data not found');
      return false;
    }
    userData = snap.data();
    window.__readQuotaMode = false;
    RC.set('userdoc', userData);
  }catch(e){
    // Firestore daily read limit reached (or offline): open the app from the last saved copy
    // so the member can still submit work and send a withdraw request.
    const saved = RC.get('userdoc', Infinity);
    if(!saved) throw e;
    userData = saved;
    window.__readQuotaMode = true;
    console.warn('User read failed — using saved copy', e);
    toast('High traffic right now — showing your last saved data');
  }
  if(isBanActive(userData)){
    try{ await fb.signOut(fb.auth); }catch(e){}
    const until = Number(userData.bannedUntil||0);
    if(until){ showBanCountdown(until); }
    else toast('Your account has been banned. Contact support for details.');
    return false;
  }

  applyFirebaseUserData(userData);
  if(!window.__readQuotaMode){
    await autoActivateIfFree();   // free mode: silent, no UI
    await grantDailyFreeIncome();
    await grantInvestmentIncome(!!force);
  }
  if(force){ loadedSections.clear(); lazyForce = true; }
  await loadUserCollections({only:STARTUP_SECTIONS, lazy:true, force:!!force});
  return true;
}

// Re-fetches everything (settings, balances, history) and re-renders the
// current screen WITHOUT reloading the browser page — so the session and
// scroll position are never disturbed and there's no risk of a logout.
async function softRefresh(btn){
  const spin = btn?.querySelector('svg');
  if(spin) spin.style.animation = 'spin .6s linear infinite';
  try{
    const ctx = await ensureReady();
    if(!ctx){ toast('Check your internet connection and try again'); return; }
    const ok = await loadCurrentUser(true);
    if(ok){
      go(currentView || 'home');
      lazyForce = false;
      toast('Refreshed');
    }
  }catch(e){
    console.error(e);
    toast("Couldn't refresh");
  } finally {
    if(spin) spin.style.animation = '';
  }
}

async function qRecentByUid(fb, uid, coll, n){
  const col = fb.collection(fb.db, coll);
  const flag = 'apx_noidx_'+coll;
  let noIdx = false; try{ noIdx = localStorage.getItem(flag)==='1'; }catch(e){}
  if(!noIdx){
    try{ return await fb.getDocs(fb.query(col, fb.where('uid','==',uid), fb.orderBy('createdAt','desc'), fb.limit(n))); }

/* ---- Daily withdrawal limit (admin-controlled: settings/config.maxWithdrawPerDay, 0 = unlimited).
   Counted from the member's own withdrawal requests for today's Bangladesh date;
   rejected / failed / cancelled requests do not use up the allowance. ---- */
const WD_NOT_COUNTED = ['rejected','failed','cancelled','canceled'];
function wdDailyLimit(){ return Math.max(0, Math.floor(Number(firebaseSettings.maxWithdrawPerDay||0))); }
function wdCountToday(list){
  const k = bdDayKey(Date.now());
  return (list||[]).filter(w => w.ts && bdDayKey(w.ts)===k && !WD_NOT_COUNTED.includes(String(w.status||'pending').toLowerCase())).length;
}
/* ---- Daily withdrawal time window (admin-controlled, Bangladesh time UTC+6).
   settings/config.withdrawWindowEnabled + withdrawStartTime/withdrawEndTime ("HH:MM").
   A window like 22:00 → 04:00 (crossing midnight) is supported. ---- */
function wdParseHM(t){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m ? (+m[1])*60 + (+m[2]) : null; }
function wdWindowOn(){ return firebaseSettings.withdrawWindowEnabled===true && wdParseHM(firebaseSettings.withdrawStartTime)!==null && wdParseHM(firebaseSettings.withdrawEndTime)!==null; }
function wdWindowOpen(){
  if(!wdWindowOn()) return true;
  const s = wdParseHM(firebaseSettings.withdrawStartTime), e = wdParseHM(firebaseSettings.withdrawEndTime);
  const now = Math.floor(((Date.now() + 6*3600e3) % 86400e3) / 60000);
  return s < e ? (now >= s && now < e) : (now >= s || now < e);
}
function wdFmtTime(t){ const m = wdParseHM(t); if(m===null) return ''; const h = Math.floor(m/60), mm = m%60; return ((h%12)||12) + ':' + String(mm).padStart(2,'0') + ' ' + (h<12?'AM':'PM'); }
function wdWindowText(){ return `${wdFmtTime(firebaseSettings.withdrawStartTime)} – ${wdFmtTime(firebaseSettings.withdrawEndTime)}`; }
/* Sections are loaded per screen, not all at login. Startup loads only what Home needs;

const __dayMs = 86400000, __BD = 6*3600e3;                // Bangladesh (UTC+6) calendar day

// opts.force : skip every cache (manual refresh)
// opts.only  : ['tx','withdraw',...] re-read just those sections (after an action)
async function loadUserCollections(opts){
  const fb = window.apexifyFirebase;

  const want = k => !only || only.includes(k);
  // sections named in `only` come straight after an action, so they must be fresh
  const fr = k => !!opts.force || (!opts.lazy && !!only && only.includes(k));
  const dstr = d => d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('en-US') : '';
  const msOf = d => d.createdAt?.toDate ? d.createdAt.toDate().getTime() : 0;
  // newest-first query when the composite index exists; otherwise the original
  // plain query (remembered, so a missing index costs nothing on later loads)
  const recent = (coll, n) => qRecentByUid(fb, uid, coll, n);

    state.referrals = await rcLoad('referrals', RC_TTL.referrals, fr('referrals'), async()=>{

      return rq.docs.map(s=>{ const d=s.data(); return {name:d.name||'User', id:d.userId||s.id, date:dstr(d), status:d.status||'inactive', gmail:Number(d.refGmailCount||0), done:d.refGmailDone===true}; });

        return {t:d.title||'Income', d: ts ? new Date(ts).toLocaleString('en-US') : 'Now', ts, amt:Math.abs(raw), sign: raw<0 ? -1 : 1};
      }).sort((a,b)=>(b.ts||Date.now())-(a.ts||Date.now())).slice(0,15);

/* ============================================================
   REFERRAL INCOME OVERRIDE — every time a member earns any income
   (daily free income, investment payouts, task/sell/salary income
   credited by admin), their direct referrer automatically gets a
   percentage of it, forever. The percentage is admin-configurable
   via settings/config -> referralOverridePercent (default 5%).

   IMPORTANT: this does NOT read the referrer's document — only
   the earner's own referrerUid (which the earner can already
   read on their own doc) is needed. The referrer's balance is
   updated with an atomic increment(), never a read-then-add. This
   matters because most rule sets only grant a normal member
   permission to WRITE specific balance fields on another user's
   doc (not to READ that whole doc) — reading it here would throw
   permission-denied and roll back the entire transaction,
   including the earner's own legitimate balance update.
   ============================================================ */
function writeReferralOverride(fb, tx, referrerUid, incomeAmount){
  if(!referrerUid || !incomeAmount) return 0;
  const percent = Number(firebaseSettings.referralOverridePercent ?? 5);
  if(percent<=0) return 0;
  const overrideAmt = Math.round(incomeAmount*percent)/100;
  if(overrideAmt<=0) return 0;

  });

}

async function processActivationReferralCommission(){
  return;   // replaced: the referral reward is now paid by the admin when the referred member has N approved Gmail sales
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  const uid = fb.auth.currentUser.uid;
  const userRef = fb.doc(fb.db,'users',uid);
  // The user document was just read — only an active, referred, not-yet-rewarded
  // member can trigger the commission, so everyone else skips the transaction.
  if(state.user.status !== 'active' || !state.user.referrerUid || state.user.referralRewarded === true) return;

  try{
    let rewarded = false;
    let referrerUid = null;
    const commission = Number(firebaseSettings.referralCommission || 15);

    await fb.runTransaction(fb.db, async tx=>{
      const userSnap = await tx.get(userRef);
      if(!userSnap.exists()) return;

      const u=userSnap.data();
      if(u.status !== 'active' || !u.referrerUid || u.referralRewarded === true) return;

      const refRef = fb.doc(fb.db,'users',u.referrerUid);
      const pubRef = fb.doc(fb.db,'publicProfiles',u.referrerUid);
      const pubSnap = await tx.get(pubRef);

      tx.update(refRef,{
        referralBalance:fb.increment(commission),
        mainBalance:fb.increment(commission),
        totalRevenue:fb.increment(commission),
        referralCount:fb.increment(1),
        updatedAt:fb.serverTimestamp()
      });
      tx.update(userRef,{referralRewarded:true, updatedAt:fb.serverTimestamp()});
      if(pubSnap.exists()){
        tx.update(pubRef,{referralCount:fb.increment(1)});
      }
      const notifRef = fb.doc(fb.collection(fb.db,'users',u.referrerUid,'notifications'));
      tx.set(notifRef,{
        title:'New referral commission',
        body:`You received ৳${commission} referral commission`,
        type:'referral', read:false, createdAt:fb.serverTimestamp()
      });
      rewarded=true;
      referrerUid=u.referrerUid;
    });

    if(rewarded){
      await fb.addDoc(fb.collection(fb.db,'transactions'),{
        uid:referrerUid,
        type:'referral',
        title:'Referral commission',
        amount:commission,
        sourceUid:uid,
        createdAt:fb.serverTimestamp()
      });
    }
  }catch(e){
    console.warn('Referral commission failed',e);
  }
}

// True only when the user must still activate (paid mode). In free mode there is
// no activation step at all: nothing is locked and no activation UI is shown.
function needsActivation(){
  return state.user.status!=='active' && firebaseSettings.activationFree!==true;
}

// What the member SEES: in free mode every account counts as active, even if the
// stored status has not been flipped yet (e.g. they have not logged in since the
// admin switched to free). The stored status is still synced by freeActivateUid().
function effStatus(s){
  return (firebaseSettings.activationFree === true && s !== 'banned') ? 'active' : s;
}

// Flips users/{uid} (+ the public mirror) to 'active'. The transaction re-reads
// settings/config on the server, so it can only succeed while the admin has free
// mode on. If the combined write is refused, the user document is activated on its
// own first and the public mirror (used for the referral list) is synced after.
async function freeActivateUid(fb, uid){
  // all checks (banned / free-mode switched on) happen on the server
  return !!(await fb.rpc('app_free_activate'));
}

// Free mode: the account activates by itself on login — no button needed.
async function autoActivateIfFree(){
  if(firebaseSettings.activationFree !== true) return false;
  if(state.user.status === 'active') return false;
  const fb = window.apexifyFirebase;
  const uid = fb && fb.auth && fb.auth.currentUser && fb.auth.currentUser.uid;
  if(!uid) return false;
  try{
    await freeActivateUid(fb, uid);
    state.user.status = 'active';
    RC.clear('referrals','leaderboard');
    return true;
  }catch(e){
    // Not fatal: the manual "Active Now" button still works as a fallback.
    console.warn('Auto free activation skipped:', e && (e.code||e.message));
    return false;
  }
}

function resizeImageToDataUrl(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read image'));
      img.onload = () => {
        // Crop to a centered square, then scale down to maxSize x maxSize
        // so the stored avatar stays small (a few tens of KB).
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side)/2;
        const sy = (img.height - side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize;
        canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  btn.innerHTML = isPass ? eyeOffIcon() : eyeIcon();
}
// Wraps a button click: disables it, shows a spinner in place of its label,
// runs the async action, then restores the button — regardless of outcome.
// Prevents double-submits and gives instant visual feedback on every action.
async function withButtonLoading(btn, fn){
  if(!btn) { await fn(); return; }
  if(btn.dataset.busy === '1') return;
  btn.dataset.busy = '1';
  const original = btn.innerHTML;
  const origWidth = btn.offsetWidth;
  btn.style.minWidth = origWidth + 'px';
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-spin"></span>';
  try{
    await fn();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
    btn.style.minWidth = '';
    btn.dataset.busy = '0';
  }
}

// Waits (quietly, no error toast) for Firebase to finish loading AND for the
// auth session to resolve to a real user. Used by every action button so a
// slow/backgrounded connection just keeps the button spinning instead of
// throwing a premature "please log in" error.
async function ensureReady(maxWaitMs){
  maxWaitMs = maxWaitMs || 30000;
  const fb = await getFB(maxWaitMs);
  if(!fb) return null;
  const user = await getCurrentUser(fb, maxWaitMs);
  if(!user) return null;
  return {fb, user};
}

function getFB(timeoutMs){
  timeoutMs = timeoutMs || 25000;
  if(window.apexifyFirebase) return Promise.resolve(window.apexifyFirebase);
  return new Promise(resolve=>{
    let done=false;
    const onReady = ()=>{ if(done) return; done=true; clearTimeout(t); resolve(window.apexifyFirebase); };
    window.addEventListener('apexify-fb-ready', onReady, {once:true});
    const t = setTimeout(()=>{
      if(done) return; done=true;
      window.removeEventListener('apexify-fb-ready', onReady);
      resolve(window.apexifyFirebase || null);
    }, timeoutMs);
  });
}
function getCurrentUser(fb, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  return new Promise(resolve=>{
    if(fb.auth.currentUser){ resolve(fb.auth.currentUser); return; }
    let done=false;
    const unsub = fb.onAuthStateChanged(fb.auth, user=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      if(!user) console.warn('[Apexify] getCurrentUser: onAuthStateChanged fired with no user — session appears lost.');
      resolve(user);
    });
    setTimeout(()=>{
      if(done) return; done=true;
      try{ unsub(); }catch(e){}
      const fallback = fb.auth.currentUser || null;
      if(!fallback) console.warn('[Apexify] getCurrentUser: timed out after '+timeoutMs+'ms with no user — Firebase Auth never resolved a session.');
      resolve(fallback);
    }, timeoutMs);
  });
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${iconCheck()}<span>${msg}</span>`;
  document.getElementById('modal-root').appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function chipClass(s){

  if(['pending','waiting','review'].includes(s)) return 'warn';

}

function switchAuth(which){

  document.getElementById('register-view').classList.toggle('hidden', which!=='register');

let sessionRestoreAttempts = 0;
async function attemptSessionRestore(isManualRetry){
  const fb = window.apexifyFirebase;
  if(!fb || !fb.auth.currentUser) return;

  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('register-view').classList.add('hidden');
  // Stay behind the boot splash (logo) for the whole attempt — don't reveal
  // this plain fallback screen unless we truly have to (see the final
  // give-up branch below). isManualRetry means the person already saw the
  // fallback screen and tapped "Try again", so it's fine to keep it visible
  // (with its spinner) while this retry runs.
  if(isManualRetry){
    document.getElementById('session-restore-view').classList.remove('hidden');
    document.getElementById('session-restore-spinner').style.display = '';
    document.getElementById('session-restore-msg').textContent = 'Restoring session...';
    document.getElementById('session-retry-btn').classList.add('hidden');
    sessionRestoreAttempts = 0;
  }

  try{
    const ok = await loadCurrentUser();
    if(ok){
      hideBootSplash();
      document.getElementById('session-restore-view').classList.add('hidden');
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      go('home');
      return;
    }
    // loadCurrentUser resolved false (e.g. banned account, or no matching
    // account doc) — it already showed its own toast; fall back to login.
    document.getElementById('session-restore-view').classList.add('hidden');
    switchAuth('login');
    hideBootSplash();
  }catch(e){
    console.error('Session restore failed', e);
    sessionRestoreAttempts++;
    // Keep retrying quietly, no matter how many times it takes — only the
    // boot splash (logo) should ever be visible during this. The 20-second
    // absolute safety net elsewhere will fall back to the plain login form
    // (never this screen) if things are truly stuck.
    setTimeout(()=>attemptSessionRestore(false), Math.min(1500*sessionRestoreAttempts, 10000));
  }
}
function forceLogoutFromRestoreScreen(){
  const fb = window.apexifyFirebase;
  document.getElementById('session-restore-view').classList.add('hidden');
  if(fb?.auth) fb.signOut(fb.auth).catch(()=>{});
  switchAuth('login');
}

async function doLogin(btn){
  const phone = normalizePhone(document.getElementById('login-phone').value.trim());
  const pass = document.getElementById('login-pass').value.trim();
  const err = document.getElementById('login-err');

  if(!phone || !pass){ err.textContent = 'Enter mobile number and password'; return; }
  err.textContent='';

  // Start the login intro animation + sound synchronously with this tap
  // so the browser ties audio permission to the click.
  if(typeof window.playLoginIntro === 'function') window.playLoginIntro();

  await withButtonLoading(btn, async ()=>{
    const fb = await getFB(30000);
    if(!fb){
      if(typeof window.stopLoginIntro === 'function') window.stopLoginIntro();
      err.textContent='Check your internet connection and try again';
      return;
    }

    showBootSplash();
    try{
      await fb.signInWithEmailAndPassword(fb.auth, phoneAuthEmail(phone), pass);
      if(!await loadCurrentUser()){
        await fb.signOut(fb.auth);
        if(typeof window.stopLoginIntro === 'function') window.stopLoginIntro();
        hideBootSplash();
        return;
      }
      if(typeof window.loginIntroMinWait === 'function') await window.loginIntroMinWait();
      if(typeof window.stopLoginIntro === 'function') window.stopLoginIntro();
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      go('home');
      hideBootSplash();
      toast('Logged in successfully');
    }catch(e){
      if(typeof window.stopLoginIntro === 'function') window.stopLoginIntro();
      console.error(e);
      hideBootSplash();
      err.textContent = e.code==='auth/invalid-credential'
        ? 'Incorrect mobile number or password'
        : (e.code==='auth/user-not-found' ? 'No account with this number' : "Couldn't log in");
    }
  });
}

function registrationErrorMessage(code){
  const messages={
    'auth/email-already-in-use':'An account already exists with this email',
    'auth/invalid-email':'Enter a valid email address',
    'auth/weak-password':'Please use a stronger password (at least 6 characters)',
    'auth/operation-not-allowed':'Email/Password sign-in is not enabled in Firebase Console',
    'auth/network-request-failed':'Internet/Firebase network connection issue',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Invalid Firebase API key. Match the apiKey from your current Web App config in Firebase Console',
    'auth/api-key-not-valid':'Invalid Firebase API key. Match the apiKey from your current Web App config in Firebase Console',
    'auth/too-many-requests':'Too many attempts. Try again in a little while',
    'permission-denied':'Firestore rules are blocking registration',
    'failed-precondition':'Check your Firestore Database/Rules configuration',
    'unavailable':'Firestore is temporarily unavailable'
  };
  return messages[code] || `Registration failed: ${code || 'Unknown Firebase error'}`;

async function doRegister(btn){
  const name=document.getElementById('reg-name').value.trim();
  const phone=normalizePhone(document.getElementById('reg-phone').value.trim());
  const referral=(document.getElementById('reg-referral').value.trim() || getReferralFromUrl()).toUpperCase();
  const pass=document.getElementById('reg-pass').value;
  const pass2=document.getElementById('reg-pass2').value;
  const err=document.getElementById('reg-err');
  if(err) err.textContent='';

  if(!name || !phone || !pass || !pass2){
    toast('Please fill in all fields'); return;
  }

  // Bangladesh mobile validation for this phone-as-login system.
  if(!/^01[3-9]\d{8}$/.test(phone)){
    toast('Enter a valid 11-digit mobile number'); return;
  }

  if(pass.length < 6){
    toast('Password must be at least 6 characters'); return;
  }

  if(pass !== pass2){
    toast('Passwords do not match'); return;
  }

  const fb = await getFB(30000);
  if(!fb){ toast('Check your internet connection and try again'); return; }

  await withButtonLoading(btn, async ()=>{
    try{
      const authEmail = phoneAuthEmail(phone);

      let finalUser=null;
      try{
        window.__pbdSignupMeta = { name, phone, referral };
        let cred;
        try{ cred = await fb.createUserWithEmailAndPassword(fb.auth, authEmail, pass); }
        finally{ window.__pbdSignupMeta = null; }
        finalUser = cred.user;
      }catch(e){
        console.error('Account creation failed:', e);
        if(e?.code==='auth/email-already-in-use'){
          if(err) err.textContent='An account already exists with this mobile number — please log in';
        }else if(e?.code==='auth/weak-password'){
          if(err) err.textContent='Please use a stronger password (at least 6 characters)';
        }else{
          if(err) err.textContent='Could not create account, please try again';
        }
        return;
      }

      try{
        await createFirestoreUser(finalUser.uid, name, phone, referral, '', false);
      }catch(e){
        console.error('Firestore profile creation failed:', e);
        try{
          if(fb.auth.currentUser && fb.auth.currentUser.uid===finalUser.uid) await fb.deleteUser(finalUser);
        }catch(e2){}
        if(err) err.textContent='Could not create your profile, please try again';
        return;
      }

      // Free mode: activate immediately at registration so the member (and the
      // referrer's list) shows Active right away and the referral counts at once.
      try{
        await loadFirebaseSettings(true);
        if(firebaseSettings.activationFree === true) await freeActivateUid(fb, finalUser.uid);
      }catch(e){ console.warn('Activation at registration skipped (will retry on login):', e && (e.code||e.message)); }

      await fb.signOut(fb.auth);

      toast('Account created — please log in now');
      document.getElementById('login-phone').value=phone;
      document.getElementById('login-pass').value='';
      switchAuth('login');

    }catch(e){
      console.error('Apexify registration error:', e);
      const code=e?.code || '';
      toast(registrationErrorMessage(code));
      console.error('Firebase error code:', code);
      console.error('Firebase error message:', e?.message || e);
    }
  });
}

async function logout(){
  const fb = await getFB();
  // personal cached lists must not stay behind on a shared phone
  try{
    const uid = fb?.auth?.currentUser?.uid;
    if(uid){ Object.keys(localStorage).filter(k=>k.startsWith('apx_rc1_'+uid+'_')||k==='apx_inv_chk_'+uid).forEach(k=>localStorage.removeItem(k)); }

  document.getElementById('auth-screen').classList.remove('hidden');

}

const EVENT_TARGETS = {
  'packages':'Subscription Packages','gmail-create':'Unlimited Gmail','sell-gmail':'Gmail Sell','sell-facebook':'Facebook Sell','sell-instagram':'Insta Sell',
  'task':'Task','wallet':'Wallet','salary':'Salary','leaderboard':'Leaderboard','withdraw':'Withdraw','network':'Refer','redeem':'Redeem Code','transactions':'History'

function eventUidKey(){
  try{ return (window.apexifyFirebase && window.apexifyFirebase.auth && window.apexifyFirebase.auth.currentUser && window.apexifyFirebase.auth.currentUser.uid) || 'anon'; }catch(e){ return 'anon'; }
}
// A "visit" = one app session. The banner is counted once per session, up to
// eventShowCount visits per member. Closing it hides it for the rest of that visit.
function eventBannerData(){
  const s = firebaseSettings || {};
  if(!s.eventEnabled) return null;
  const title = String(s.eventTitle||'').trim();
  if(!title) return null;
  if(s.eventEndDate){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s.eventEndDate));
    if(m && Date.now() > new Date(+m[1], +m[2]-1, +m[3], 23, 59, 59).getTime()) return null;
  }
  const id = String(s.eventId||'0');
  const uk = eventUidKey();
  const sk = 'apx_ev1s_'+uk+'_'+id;
  let sess = null; try{ sess = sessionStorage.getItem(sk); }catch(e){}
  if(sess === 'closed') return null;
  if(sess !== 'shown'){
    // every new visit (session) shows the event popup again
    try{ sessionStorage.setItem(sk, 'shown'); }catch(e){}
  }
  const target = EVENT_TARGETS[s.eventTarget] ? s.eventTarget : '';
  return { id, title, message:String(s.eventMessage||'').trim(), target, btn:String(s.eventBtnLabel||'').trim() || 'Join now' };
}
function renderEventBanner(){
  // The event now opens as a full-screen popup (mounted on <body>) instead of an inline card.
  setTimeout(showEventPopup, 0);
  return '';
}
function showEventPopup(){
  if(document.getElementById('ev-pop')) return;
  const e = eventBannerData();
  if(!e) return;
  const tagIc = icon('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/>',14);
  const wrap = document.createElement('div');
  wrap.id = 'ev-pop'; wrap.className = 'evp'; wrap.dataset.id = e.id;
  wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true'); wrap.setAttribute('aria-labelledby','evp-title');
  wrap.innerHTML = `
    <div class="evp-card">
      <button class="evp-x" type="button" aria-label="Close" onclick="dismissEventBanner('${esc(e.id)}')">${icon('<path d="M6 6l12 12M18 6L6 18"/>',20)}</button>
      <div class="evp-badge">${icon('<path d="M12 2l2.6 6.3 6.8.6-5.2 4.5 1.6 6.6L12 16.4 6.2 20l1.6-6.6L2.6 8.9l6.8-.6z"/>',30)}</div>
      <span class="ev-pill">${icon('<path d="M12 2l2.6 6.3 6.8.6-5.2 4.5 1.6 6.6L12 16.4 6.2 20l1.6-6.6L2.6 8.9l6.8-.6z"/>',11)} Special Event</span>
      <h2 class="evp-title" id="evp-title">${esc(e.title)}</h2>
      ${e.message ? `<p class="evp-msg">${esc(e.message)}</p>` : ''}
      ${e.target ? `<div class="evp-foot">
        <span class="ev-tag">${tagIc}<span>${esc(EVENT_TARGETS[e.target])}</span></span>
        <button class="evp-go" type="button" onclick="dismissEventBanner('${esc(e.id)}','${e.target}')">${esc(e.btn)} ${icon('<path d="M9 6l6 6-6 6"/>',16)}</button>
      </div>` : `<button class="evp-go evp-ok" type="button" onclick="dismissEventBanner('${esc(e.id)}')">OK</button>`}
    </div>`;
  document.body.appendChild(wrap);
  document.body.classList.add('evp-lock');
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('show')));
  document.addEventListener('keydown', evpKey);
  const xb = wrap.querySelector('.evp-x'); if(xb) try{ xb.focus({preventScroll:true}); }catch(_){}
}
function evpKey(ev){
  if(ev.key==='Escape'){ const el=document.getElementById('ev-pop'); if(el) dismissEventBanner(el.dataset.id||''); }
}
function dismissEventBanner(id, target){
  try{ sessionStorage.setItem('apx_ev1s_'+eventUidKey()+'_'+id, 'closed'); }catch(e){}
  document.removeEventListener('keydown', evpKey);
  document.body.classList.remove('evp-lock');
  const el = document.getElementById('ev-pop');
  if(el){ el.classList.remove('show'); setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 320); }
  if(target) go(target);
}

    const left = Math.max(0, need-have);
    const chip = done ? `<span class="rf-chip done">Completed</span>` : have>0 ? `<span class="rf-chip prog">In progress</span>` : `<span class="rf-chip new">Not started</span>`;

async function submitAccountSale(type, btn){
  const meta = SELL_SERVICE_META[type];
  const err = document.getElementById(`sell-${type}-err`);
  const data = {};
  for(const f of meta.fields){
    const val = document.getElementById(`sell-${type}-${f.key}`).value.trim();
    if(!val){ err.textContent = `Enter ${f.label}`; return; }
    data[f.key] = val;
  }
  // Gmail Sell: the FULL address (name@gmail.com) is mandatory
  if(type==='gmail'){
    data.email = data.email.replace(/\s+/g,'');
    if(!/^[A-Za-z0-9._%+\-]+@gmail\.com$/i.test(data.email)){ err.textContent = 'Enter the full Gmail address (example: name@gmail.com)'; return; }
  }
  err.textContent = '';

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent = 'Check your internet connection and try again'; return; }
    const {fb, user} = ctx;
    let svc = state.sellServices[type] || {};
    // Gmail Sell: password must be exactly the one set by admin — checked against the freshest value
    if(type==='gmail'){
      try{
        const fresh = await fb.getDoc(fb.doc(fb.db,'accountServices',type));
        if(fresh.exists()) svc = {...svc, ...fresh.data()};
      }catch(e){ console.warn('service refresh failed', e); }
      const need = String(svc.requiredPassword||'');
      if(need && data.password !== need){ err.textContent = 'Wrong password. Use exactly the password shown above'; return; }
    }
    const rate = Number(svc.rate||0);

    try{
      await fb.addDoc(fb.collection(fb.db,'accountSubmissions'),{
        uid:user.uid, serviceType:type, serviceName:meta.label, rate,
        data, status:'pending', createdAt:fb.serverTimestamp()
      });
      meta.fields.forEach(f=>{ document.getElementById(`sell-${type}-${f.key}`).value=''; });
      toast('Submitted, admin is reviewing');
      await loadUserCollections({only:['sellSubs']});
      go('sell-'+type);
    }catch(e){
      console.error(e);
      err.textContent = "Couldn't submit, try again";
    }
  });
}

/* ---- Task video guide: opens inside the app (YouTube / Google Drive / direct .mp4); any other link opens in a new tab ---- */
function apxVideoInfo(u){
  if(!u || typeof u!=='string') return null;
  try{
    const x = new URL(u.trim());
    if(!/^https?:$/.test(x.protocol)) return null;
    const h = x.hostname.replace(/^(www|m)\./,'');
    let id = null;
    if(h==='youtu.be') id = x.pathname.slice(1).split('/')[0];
    else if(h==='youtube.com' || h==='music.youtube.com'){
      if(x.pathname==='/watch') id = x.searchParams.get('v');
      else { const m = x.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/); if(m) id = m[2]; }
    }
    if(id && /^[\w-]{6,20}$/.test(id)) return {type:'iframe', src:`https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1&autoplay=1`, url:x.href};
    const dm = x.hostname==='drive.google.com' && x.pathname.match(/\/file\/d\/([\w-]+)/);
    if(dm) return {type:'iframe', src:`https://drive.google.com/file/d/${dm[1]}/preview`, url:x.href};
    if(/\.(mp4|webm|ogg)$/i.test(x.pathname)) return {type:'video', src:x.href, url:x.href};
    return {type:'link', url:x.href};
  }catch(e){ return null; }
}
window.openTaskVideo = function(id){
  const t = (state.tasks||[]).find(x=>x.id===id);
  const v = t && apxVideoInfo(t.videoUrl);
  if(!v) return;
  if(v.type==='link'){ window.open(v.url,'_blank','noopener'); return; }
  closeTaskVideo();
  const ov = document.createElement('div');
  ov.id = 'apx-vm'; ov.className = 'apx-vm';
  ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-labelledby','apx-vm-t');

      state.user.mainBalance = Number(state.user.mainBalance||0)+amount;
      state.user.totalRevenue = Number(state.user.totalRevenue||0)+amount;
      document.getElementById('redeem-code').value='';
      toast(`Code claimed successfully, ৳${fmt(amount)} added`);
      go('redeem');
    }catch(e){
      const map = {duplicate:"You've already used this code", invalid:'Invalid code', inactive:'This code is disabled', expired:'This code has expired', limit:'This code has reached its usage limit'};
      err.textContent = map[e.message] || "Couldn't use this code";
    }
  });
}

async function submitWithdraw(btn){
  const amt = Number(document.getElementById('withdraw-amt').value);
  const minWd = Number(firebaseSettings.minWithdraw || 100);
  const maxWd = Number(firebaseSettings.maxWithdraw || 20000);
  if((firebaseSettings.withdrawPolicy||'all')==='subscribers_only' && !state.user.hasPurchasedPackage && !state.mySubscriptions.length){
    wdErr('You need to buy any subscription package before withdrawing');
    return;
  }
  if(!amt || amt < minWd){ wdErr(`Minimum withdrawal is ৳${fmt(minWd)}`); return; }
  if(amt > maxWd){ wdErr(`Maximum withdrawal is ৳${fmt(maxWd)}`); return; }
  if(!state.user.bkashNumber && !state.user.nagadNumber){ wdErr('Add a wallet first'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ toast('Check your internet connection and try again'); return; }
    const {fb, user} = ctx;

    const uid = user.uid;
    // Fresh admin settings + fresh count from the server, so the daily limit
    // can't be dodged with a stale screen or a second device.
    try{
      await loadFirebaseSettings(false);
      if(!wdWindowOpen()){
        go('withdraw');
        toast(`Withdrawals are open daily ${wdWindowText()} only`);
        return;
      }
      const L = wdDailyLimit();
      if(L>0 && wdCountToday(state.withdrawHistory) >= L){   // uses the member's own history already on screen (no extra reads)
        go('withdraw');
        toast(`Daily limit reached — you can withdraw ${L} time${L>1?'s':''} per day`);
        return;
      }
    }catch(e){ console.warn('Daily limit check failed', e); }
    let walletType, walletNumber;
    if(state.user.bkashNumber && state.user.nagadNumber){
      const choice = document.getElementById('withdraw-wallet-choice').value;
      walletType = choice==='bkash' ? 'bKash' : 'Nagad';
      walletNumber = choice==='bkash' ? state.user.bkashNumber : state.user.nagadNumber;
    }else if(state.user.bkashNumber){
      walletType = 'bKash'; walletNumber = state.user.bkashNumber;
    }else{
      walletType = 'Nagad'; walletNumber = state.user.nagadNumber;
    }
    const fee = Math.round(amt*(Number(firebaseSettings.withdrawFeePercent ?? 2)/100));
    const net = amt-fee;
    try{
      await fb.rpc('app_withdraw', {p_amount:amt, p_wallet_type:walletType, p_wallet_number:walletNumber});
    }catch(e){
      const m = e && e.message;
      if(m==='insufficient'){ toast('Insufficient balance'); return; }
      if(m==='subscribers-only'){ toast('You need to buy any subscription package before withdrawing'); return; }
      if(m==='below-minimum'){ toast(`Minimum withdrawal is ৳${fmt(minWd)}`); return; }
      if(m==='above-maximum'){ toast(`Maximum withdrawal is ৳${fmt(maxWd)}`); return; }
      console.error(e); toast('Request failed'); return;
    }
    try{
      state.user.mainBalance = Number(state.user.mainBalance||0)-amt;
      toast('Withdrawal request sent');
      const nowMs = Date.now();
      state.withdrawHistory.unshift({amt, wallet:`${walletType} •• ${(walletNumber||'').slice(-4)}`, date:new Date(nowMs).toLocaleDateString('en-US'), ts:nowMs, status:'pending'});
      RC.set('withdraw', state.withdrawHistory);
      go('withdraw');
    }catch(e){
      console.error(e);
    }
  });
}

let currentTaskProofImage = null;
function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * maxWidth/w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('image-decode-failed'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('file-read-failed'));
    reader.readAsDataURL(file);
  });
}
async function compressImageForUpload(file){
  let quality = 0.7, maxWidth = 900;
  let dataUrl = await compressImageFile(file, maxWidth, quality);
  while(dataUrl.length > 700000 && quality > 0.3){
    quality -= 0.15;
    dataUrl = await compressImageFile(file, maxWidth, quality);
  }
  if(dataUrl.length > 700000){
    dataUrl = await compressImageFile(file, 600, 0.5);
  }
  return dataUrl;
}
async function handleTaskProofImage(input){
  const file = input.files[0];
  if(!file) return;
  const wrap = document.getElementById('task-proof-preview-wrap');
  wrap.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:var(--text-mute);font-size:12.5px; padding:8px 0;"><div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Processing image...</div>`;
  try{
    currentTaskProofImage = await compressImageForUpload(file);
    wrap.innerHTML = `
      <div style="position:relative; display:inline-block; max-width:100%;">
        <img src="${currentTaskProofImage}" style="width:100%; max-height:200px; object-fit:cover; border-radius:12px; border:1px solid var(--border); display:block;">
        <button type="button" onclick="removeTaskProofImage()" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:99px; width:28px; height:28px; font-size:14px; line-height:1;">✕</button>
      </div>`;
  }catch(e){
    console.error(e);
    currentTaskProofImage = null;
    wrap.innerHTML = `<button type="button" class="btn btn-outline btn-block" onclick="document.getElementById('task-proof-file').click()">Choose image</button>`;
    toast("Couldn't process image, try again");
  }
}

async function submitTaskProof(taskId, btn){
  const proof = document.getElementById('task-proof').value.trim();
  const err = document.getElementById('task-submit-err');
  if(!currentTaskProofImage){ err.textContent='Upload a proof screenshot'; return; }
  err.textContent='';

  const t = state.tasks.find(x=>x.id===taskId);
  if(!t){ toast('Task not found'); return; }

  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ err.textContent='Check your internet connection and try again'; return; }
    const {fb, user} = ctx;

    try{
      const dupSnap = await fb.getDocs(fb.query(
        fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',user.uid), fb.where('taskId','==',taskId), fb.limit(1)
      ));
      if(!dupSnap.empty && dupSnap.docs[0].data().status!=='rejected'){
        err.textContent='This task has already been submitted'; return;
      }

      await fb.addDoc(fb.collection(fb.db,'taskSubmissions'),{
        uid:user.uid, taskId, taskTitle:t.title, reward:Number(t.reward||0),
        proof, proofImage:currentTaskProofImage, status:'pending', createdAt:fb.serverTimestamp()
      });
      currentTaskProofImage = null;
      toast('Task submitted, admin is reviewing');
      closeModal();
      await loadUserCollections({only:['taskSubs']});
      go('task');
    }catch(e){
      console.error(e);
      err.textContent = e?.code==='resource-exhausted' || /longer than/i.test(e?.message||'')
        ? 'Image is too large, try a smaller/lighter image'
        : "Couldn't submit, try again";
    }
  });
}

function depStepper(step){
  return `<div class="dep-steps">
    <div class="dep-st on"><i>${step>1?depIc('check',13):'1'}</i>Amount</div>
    <div class="dep-st-line ${step>1?'on':''}"><b></b></div>
    <div class="dep-st ${step>1?'on':''}"><i>2</i>Payment</div>
  </div>`;
}

// Renders into ONE overlay. If it already exists, only the inner content is swapped.
function depRender(inner){
  let ov = document.getElementById('dep-overlay');
  if(!ov){
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    document.getElementById('modal-root').insertAdjacentHTML('beforeend',
      `<div class="modal-overlay" id="dep-overlay" onclick="if(event.target===this) closeDeposit()"><div class="sheet dep-sheet" id="dep-sheet"></div></div>`);
    ov = document.getElementById('dep-overlay');
  }
  const sh = document.getElementById('dep-sheet');
  sh.innerHTML = inner;
  sh.scrollTop = 0;
}
function closeDeposit(){
  const ov = document.getElementById('dep-overlay');
  if(!ov) return;
  ov.classList.add('closing');
  setTimeout(()=>{ ov.remove(); }, 160);
}

async function openDeposit(){
  const minDep = Number(firebaseSettings.minDeposit||50);
  const maxDep = Number(firebaseSettings.maxDeposit||50000);
  const quick = [100,500,1000,2000,5000].filter(v=>v>=minDep && v<=maxDep);
  depRender(`
    <div class="dep-top">
      <div class="sheet-handle"></div>
      <div class="dep-bar">
        <div class="dep-ic-head">${depIc('plus',24)}</div>
        <div class="ttl"><h3>Deposit</h3><p>Choose a payment method and enter the amount you want to deposit.</p></div>
        <button class="dep-x" aria-label="Close" onclick="closeDeposit()">${depIc('close',17)}</button>
      </div>
    </div>
    ${depStepper(1)}
    <div class="dep-pane">
      <span class="dep-lbl">Payment method</span>
      <div class="dep-methods">
        <button type="button" class="dep-m dep-method-item ${selectedDepositMethod==='bKash'?'active':''}" onclick="selectDepositMethod('bKash', this)">
          <span class="lg">${depLogo('bKash')}</span><span><b>bKash</b><small>Send Money</small></span><span class="tick">${depIc('check',11)}</span>
        </button>
        <button type="button" class="dep-m dep-method-item ${selectedDepositMethod==='Nagad'?'active':''}" onclick="selectDepositMethod('Nagad', this)">
          <span class="lg">${depLogo('Nagad')}</span><span><b>Nagad</b><small>Send Money</small></span><span class="tick">${depIc('check',11)}</span>
        </button>
      </div>

      <span class="dep-lbl">Deposit amount</span>
      <div class="dep-amt"><span class="cur">৳</span><input id="deposit-amount" type="number" inputmode="numeric" min="1" placeholder="0" value="${depositAmount?depositAmount:''}" oninput="depSyncChips()"></div>
      ${quick.length ? `<div class="dep-chips">${quick.map(v=>`<button type="button" class="dep-chip" data-v="${v}" onclick="depPickAmount(${v})">৳${fmt(v)}</button>`).join('')}</div>` : ''}
      <div class="dep-limit">${depIc('info',14)}<span>Limit: ৳${fmt(minDep)} – ৳${fmt(maxDep)}</span></div>
      <div class="dep-err" id="deposit-err"></div>
    </div>
    <div class="dep-actions">
      <button class="btn dep-cta" onclick="goToDepositStep2()"><span>Continue</span>${depIc('arrow',18)}</button>
    </div>
    <div class="dep-secure">${depIc('shield',15)}<span>Your balance is added only after the payment is verified.</span></div>
  `);
  depSyncChips();
}

function depPickAmount(v){
  const el = document.getElementById('deposit-amount');
  if(el){ el.value = v; }
  depSyncChips();
}
function depSyncChips(){
  const v = Number(document.getElementById('deposit-amount')?.value || 0);
  document.querySelectorAll('.dep-chip').forEach(c=>c.classList.toggle('on', Number(c.dataset.v)===v));
}
function depError(msg){
  const err = document.getElementById('deposit-err');
  if(!err) return;
  err.textContent = msg;
  err.classList.remove('shake'); void err.offsetWidth; if(msg) err.classList.add('shake');
}

function selectDepositMethod(method, el){
  selectedDepositMethod = method;
  document.querySelectorAll('.dep-method-item').forEach(item=>item.classList.remove('active'));
  el?.classList.add('active');
}

function goToDepositStep2(){
  const amount = Number(document.getElementById('deposit-amount')?.value || 0);
  const minDep = Number(firebaseSettings.minDeposit || 50);
  const maxDep = Number(firebaseSettings.maxDeposit || 50000);
  if(!amount || amount < 1){ depError('Enter deposit amount'); return; }
  if(amount < minDep){ depError(`Minimum deposit is ৳${fmt(minDep)}`); return; }
  if(amount > maxDep){ depError(`Maximum deposit is ৳${fmt(maxDep)}`); return; }
  depError('');
  depositAmount = amount;
  openDepositStep2();
}
