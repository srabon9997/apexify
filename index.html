async function depPasteTx(){
  try{
    const t = (await navigator.clipboard.readText() || '').trim();
    if(t){ document.getElementById('deposit-txid').value = t.slice(0,80); depError(''); }
    else toast('Clipboard is empty');
  }catch(e){ toast('Long-press the field to paste'); }
}

function copyDepositNumber(num){
  const b = document.getElementById('dep-copy-btn');
  const mark = ()=>{
    toast('Payment number copied');
    if(b){ b.classList.add('done'); b.innerHTML = depIc('check',15)+'<span>Copied</span>';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('done'); b.innerHTML = depIc('copy',15)+'<span>Copy</span>'; } }, 1800); }
  };
  navigator.clipboard?.writeText(num).then(mark).catch(()=>toast(num));
}

let depSubmitting = false;
async function submitDeposit(btn){
  if(depSubmitting) return; // block double-submit
  const method = selectedDepositMethod;
  const amount = depositAmount;
  const txid = document.getElementById('deposit-txid')?.value.trim();

  if(!amount || amount < 1){ depError('Enter deposit amount'); return; }
  if(!txid){ depError('Enter Transaction ID'); return; }

  depError('');
  depSubmitting = true;
  await withButtonLoading(btn, async ()=>{
    const ctx = await ensureReady();
    if(!ctx){ depError('Check your internet connection and try again'); return; }
    const {fb, user} = ctx;
    try{
      const uid = user.uid;
      await fb.addDoc(fb.collection(fb.db,'depositRequests'),{
        uid,
        method,
        receiverNumber: getDepositNumber(method),
        amount,
        transactionId:txid,
        status:'pending',
        createdAt:fb.serverTimestamp()
      });
      depositAmount = 0;
      closeDeposit(); // exit immediately on successful submit
      toast('Deposit request submitted. Balance will be added after verification');
    }catch(e){
      console.error(e);
      depError("Couldn't submit request. Try again");
    }
  });
  depSubmitting = false;
}

/* Init: start on login (hidden behind the boot splash until we know the
   real auth state, so a returning logged-in user never sees a flash of
   the login form before the app shell appears). */
switchAuth('login');

function showBootSplash(){
  const el = document.getElementById('boot-splash');
  if(el) el.classList.remove('hidden');
}
function hideBootSplash(){
  const el = document.getElementById('boot-splash');
  if(el) el.classList.add('hidden');
}
// Safety net: never leave someone stuck behind the splash forever if
// Firebase fails to initialize (e.g. network totally blocked). Generous
// timeout — attemptSessionRestore's own 3 retries can legitimately take
// a while on a slow connection, and this must never interrupt them early.
setTimeout(()=>{
  const el = document.getElementById('boot-splash');
  if(el && !el.classList.contains('hidden')){
    hideBootSplash();
    switchAuth('login');
  }
}, 20000);

(async function initFirebaseSession(){
  if(!window.apexifyFirebase){
    await new Promise(resolve => window.addEventListener('apexify-fb-ready', resolve, {once:true}));
  }
  const fb=window.apexifyFirebase;
  if(!fb){ hideBootSplash(); return; }

  try{
    await loadFirebaseSettings();

    fb.onAuthStateChanged(fb.auth, async user=>{
      if(!user){ hideBootSplash(); return; }

      // A signed-in account whose Auth email is still the real address
      // (a temporary verification-only account) means the person left
      // mid-registration before finishing on the registration form. Bring
      // them back to the registration screen with the email pre-filled and
      // status restored, instead of trying to load a full profile.
      if(!isPhoneLoginEmail(user.email)){
        // Leftover from the old verification flow: remove it from the main session.
        // (Gmail verification now runs in its own isolated session.)
        try{ await fb.signOut(fb.auth); }catch(e){}
        hideBootSplash();
        return;
      }

      attemptSessionRestore(false);
    });
  }catch(e){
    console.error('Firebase init failed',e);
    hideBootSplash();
  }

  const ref=getReferralFromUrl();
  const refInput=document.getElementById('reg-referral');
  if(ref && refInput) refInput.value=ref;
})();

.wd-eyebrow{display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 7px; border-radius:99px; font:800 9.5px/1 'Inter',sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#F59E0B;

.wd-lock{display:flex; gap:12px; padding:14px; border-radius:20px; margin-bottom:16px; background:linear-gradient(180deg,rgba(245,158,11,.09),rgba(245,158,11,.04)); border:1px solid rgba(245,158,11,.34);}

.wd-lock b{display:block; font:800 13.5px/1.2 'Plus Jakarta Sans',sans-serif; color:#F59E0B;}
.wd-lock span{display:block; margin:4px 0 11px; font-size:12px; line-height:1.5; color:var(--text-mute);}
.btn.wd-lock-btn{min-height:42px; padding:0 18px; border-radius:13px; font-weight:800; font-size:13px; color:#451A03; background:linear-gradient(135deg,#FCD34D,#D97706); border:none; box-shadow:0 10px 20px -10px rgba(245,158,11,.7);}

.wd-form{position:relative; border-radius:24px; padding:16px; margin-bottom:6px;

.wd-sum{margin-top:16px; border-radius:18px; padding:4px 14px; background:rgba(255,255,255,.5); border:1px solid rgba(15,23,42,.04);}

.wd-sum .net b{font-size:17px; color:#10B981;}

.wd-wallets{display:flex; flex-direction:column; gap:10px;}
.wd-w{position:relative; display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; text-align:left; color:#fff; width:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.92)); border:1.5px solid rgba(148,163,184,.16); transition:border-color .2s,box-shadow .25s,transform .15s;}
.wd-w:active{transform:scale(.98);}
.wd-w .lg{flex:none; width:42px; height:42px; border-radius:13px; overflow:hidden; display:flex; box-shadow:0 8px 18px -8px rgba(15,23,42,.2);}

.wd-w .tx{flex:1; min-width:0;}
.wd-w .tx b{display:block; font:800 14px/1.1 'Plus Jakarta Sans',sans-serif;}
.wd-w .tx small{display:block; margin-top:5px; font:700 13px/1 'Plus Jakarta Sans',sans-serif; letter-spacing:1px; color:var(--text-2);}
.wd-w .rd{flex:none; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1.5px solid rgba(148,163,184,.35); color:transparent; transition:all .2s;}
.wd-w.active{border-color:rgba(16,185,129,.65); background:linear-gradient(180deg,rgba(16,185,129,.12),rgba(255,255,255,.92)); box-shadow:0 0 0 3px rgba(16,185,129,.08),0 14px 28px -14px rgba(16,185,129,.5);}

.wd-w.single{cursor:default;}
.wd-w.add{border-style:dashed; border-color:rgba(14,165,233,.5);}
.wd-w.add .lg{align-items:center; justify-content:center; color:#0EA5E9; background:rgba(14,165,233,.1); border:1px solid rgba(14,165,233,.3); box-shadow:none;}
.wd-w.add .go{color:#0EA5E9; flex:none;}

.wd-err{min-height:18px; margin:10px 2px 0; font-size:12.2px; font-weight:700; color:#DB2777;}
.wd-err.shake{animation:walShake .35s;}
.btn.wd-cta{position:relative; overflow:hidden; width:100%; min-height:56px; margin-top:4px; border-radius:17px; font-weight:800; font-size:15px; letter-spacing:.2px; color:#FFFFFF;
  border:1px solid rgba(255,255,255,.3); background:linear-gradient(135deg,#34D399,#059669); box-shadow:0 14px 28px -10px rgba(16,185,129,.7),inset 0 1px 0 rgba(255,255,255,.45);}
.btn.wd-cta::after{content:''; position:absolute; top:0; bottom:0; left:0; width:38%; pointer-events:none; background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent); animation:walSweep 3.6s ease-in-out infinite;}
.btn.wd-cta:disabled{opacity:1; color:var(--text-mute); background:rgba(148,163,184,.1); border:1px solid rgba(148,163,184,.2); box-shadow:none;}

.wd-secure{display:flex; align-items:center; justify-content:center; gap:7px; margin:12px 6px 0; font-size:11px; line-height:1.5; color:var(--text-mute); text-align:center;}

.wd-sec{display:flex; align-items:center; justify-content:space-between; margin:26px 2px 12px;}

.wd-sec h3::before{content:''; width:4px; height:16px; border-radius:9px; background:linear-gradient(180deg,#FCD34D,#D97706); box-shadow:0 0 10px rgba(245,158,11,.6);}
.wd-count{padding:5px 10px; border-radius:99px; font:700 10.5px/1 'Inter',sans-serif; color:#F59E0B; background:rgba(245,158,11,.10); border:1px solid rgba(245,158,11,.28);}
.wd-h{display:flex; align-items:center; gap:12px; padding:12px 13px; margin-bottom:9px; border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.9)); border:1px solid rgba(148,163,184,.12); animation:walRise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--d,0) * 45ms);}
.wd-h .ic{flex:none; width:42px; height:42px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#DB2777; background:rgba(219,39,119,.10); border:1px solid rgba(219,39,119,.28);}
.wd-h .bd{flex:1; min-width:0;}
.wd-h .bd b{display:block; font:800 15px/1 'Plus Jakarta Sans',sans-serif; color:#fff;}
.wd-h .bd span{display:block; margin-top:6px; font-size:11px; color:var(--text-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wd-st{flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:99px; font:700 10.5px/1 'Inter',sans-serif;}
.wd-st.ok{color:#10B981; background:rgba(16,185,129,.11); border:1px solid rgba(16,185,129,.34);}
.wd-st.warn{color:#F59E0B; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.34);}
.wd-st.bad{color:#DB2777; background:rgba(219,39,119,.1); border:1px solid rgba(219,39,119,.34);}
.wd-empty{text-align:center; padding:26px 16px; border-radius:20px; background:rgba(255,255,255,.4); border:1px dashed rgba(148,163,184,.24);}
.wd-empty .ic{width:46px; height:46px; margin:0 auto 10px; border-radius:15px; display:flex; align-items:center; justify-content:center; color:var(--text-mute); background:rgba(148,163,184,.08);}
.wd-empty span{font-size:12.5px; color:var(--text-mute); font-weight:600;}

/* review sheet */
#wd-overlay{animation:depFade .22s ease both;}
#wd-overlay.closing{animation:depFade .16s ease reverse both;}
#wd-overlay .sheet{position:relative; padding:0 0 calc(18px + env(safe-area-inset-bottom)); overflow:hidden;
  background:linear-gradient(180deg,#F1F5F9 0%,#FFFFFF 45%,#F1F5F9 100%) !important; border-top:1px solid rgba(14,165,233,.32) !important;
  box-shadow:0 -24px 60px rgba(15,23,42,.2),0 -1px 40px -10px rgba(14,165,233,.3) !important; animation:depUp .38s cubic-bezier(.2,.85,.2,1) both;}
#wd-overlay.closing .sheet{animation:depDown .16s ease-in both;}
.wd-rv{padding:10px 20px 0; text-align:center;}
.wd-rv .sheet-handle{margin:0 auto 18px;}
.wd-rv h3{margin:0; font:800 20px/1.1 'Plus Jakarta Sans',sans-serif; color:#fff; letter-spacing:-.3px;}
.wd-rv p{margin:6px 0 0; font-size:12px; color:var(--text-mute);}
.wd-rv-big{margin:18px 0 14px; padding:16px; border-radius:20px; background:radial-gradient(120% 100% at 100% 0%,rgba(16,185,129,.16),transparent 60%),rgba(255,255,255,.6); border:1.5px dashed rgba(16,185,129,.45);}
.wd-rv-big small{display:block; font:700 9.5px/1 'Inter',sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--text-mute);}
.wd-rv-big b{display:block; margin-top:10px; font:800 34px/1 'Plus Jakarta Sans',sans-serif; letter-spacing:-1px; color:#fff;}
.wd-rv-big b em{font-style:normal; color:#10B981; font-size:25px; margin-right:2px;}
.wd-rv-rows{text-align:left; border-radius:18px; padding:2px 14px; margin-bottom:14px; background:rgba(255,255,255,.4); border:1px solid rgba(15,23,42,.04);}
.wd-rv-rows div{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; font-size:12.5px; color:var(--text-mute);}
.wd-rv-rows div + div{border-top:1px solid rgba(15,23,42,.04);}
.wd-rv-rows b{font:800 13.5px/1.1 'Plus Jakarta Sans',sans-serif; color:#fff; text-align:right;}
.wd-rv-rows .w{display:flex; align-items:center; gap:8px;}
.wd-rv-rows .w svg{width:22px; height:22px; border-radius:7px;}
.wd-rv-warn{display:flex; gap:11px; text-align:left; padding:12px 13px; border-radius:16px; margin-bottom:16px; background:rgba(14,165,233,.07); border:1px solid rgba(14,165,233,.28);}
.wd-rv-warn svg{flex:none; margin-top:1px; color:#0EA5E9;}
.wd-rv-warn span{font-size:11.7px; line-height:1.5; color:var(--text-2);}
#wd-overlay .wd-acts{padding:0 20px;}
@media (prefers-reduced-motion:reduce){
  .wd-hero,.wd-hero::before,.wd-hero::after,.wd-form,.wd-h,.btn.wd-cta::after,#wd-overlay,#wd-overlay .sheet{animation:none !important;}
}


/* =====================================================================
   WITHDRAW — PROFESSIONAL FINTECH LAYER (visual only: same ids, handlers,
   request payload & logic — no Firestore rules change needed)
   Calm surfaces · 1px borders · no glow · no looping animation
   ===================================================================== */
.wd-hero,.wd-form,.wd-h,.wd-hero::before,.wd-hero::after,#wd-overlay,#wd-overlay .sheet,.wd-err.shake{animation:none !important;}
.wd-hero::before,.wd-hero::after,.btn.wd-cta::after,#wd-overlay .btn.dep-cta::after{display:none !important;}

/* Balance card */
.wd-hero{border-radius:20px; padding:18px 18px 16px; margin-bottom:14px;
  background:linear-gradient(180deg,#0C2740,#FFFFFF); border:1px solid rgba(148,163,184,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 28px -16px rgba(15,23,42,.2);}
.wd-eyebrow{padding:0; background:none; border:none; gap:8px; font:600 11.5px/1 'Inter',sans-serif; letter-spacing:.04em; text-transform:none; color:var(--text-mute);}
.wd-eyebrow i{width:24px; height:24px; border-radius:8px; color:var(--primary); background:rgba(16,185,129,.10); border:1px solid rgba(16,185,129,.22); box-shadow:none;}
.wd-bal{margin-top:14px; font-size:36px; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
.wd-bal em{color:var(--text-2); font-size:24px; margin-right:4px; font-weight:700;}
.wd-meta{gap:0; margin-top:16px; padding-top:14px; border-top:1px solid rgba(148,163,184,.14);}
.wd-meta div{padding:0; background:none; border:none; border-radius:0;}
.wd-meta div + div{padding-left:16px; border-left:1px solid rgba(148,163,184,.14);}
.wd-meta small{font-size:10.5px; letter-spacing:.06em; font-weight:600;}
.wd-meta b{margin-top:6px; font-size:14px; font-weight:700;}

/* Subscription lock notice */
.wd-lock{padding:14px; border-radius:16px; background:rgba(245,158,11,.06); border:1px solid rgba(245,158,11,.26);}
.wd-lock b{font-size:13.5px; font-weight:700;}
.btn.wd-lock-btn{min-height:40px; border-radius:12px !important; font-weight:700; background:var(--gold); box-shadow:none; color:#451A03;}

/* Form card */
.wd-form{border-radius:20px; padding:16px; background:var(--surface); border:1px solid var(--border); box-shadow:0 12px 28px -18px rgba(15,23,42,.25);}
.wd-lbl{margin-bottom:8px; font:600 11px/1 'Inter',sans-serif; letter-spacing:.06em; color:var(--text-mute);}
.wd-amt{padding:2px 14px; border-radius:14px; background:var(--input); border:1px solid rgba(148,163,184,.2);}
.wd-amt:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px rgba(16,185,129,.14);}
.wd-amt.bad{border-color:var(--danger); box-shadow:0 0 0 3px rgba(239,68,68,.12);}
.wd-amt .cur{font-size:24px; color:var(--text-2); font-weight:700;}
.wd-amt input{padding:13px 0; font-size:26px; font-weight:700; letter-spacing:-.4px; font-variant-numeric:tabular-nums;}
.wd-amt input::placeholder{font-size:16px; font-weight:500; color:var(--text-dim);}

.wd-chips{gap:8px; margin-top:10px;}
.wd-chip{padding:8px 13px; border-radius:10px; font-weight:600; color:var(--text-2); background:transparent; border:1px solid rgba(148,163,184,.22);}
.wd-chip.on{color:var(--primary); background:rgba(16,185,129,.10); border-color:rgba(16,185,129,.5); box-shadow:none;}

.wd-sum{margin-top:14px; padding:2px 14px; border-radius:14px; background:rgba(148,163,184,.05); border:1px solid rgba(148,163,184,.12);}
.wd-sum div{padding:11px 0;}
.wd-sum b{font-weight:700; font-variant-numeric:tabular-nums;}
.wd-sum .net b{font-size:16px; color:var(--primary);}

/* Wallet selector */
.wd-w{padding:12px; border-radius:14px; background:var(--input); border:1px solid rgba(148,163,184,.2); box-shadow:none;}
.wd-w .lg{border-radius:11px; box-shadow:none;}
.wd-w .tx small{margin-top:5px; font-weight:600; letter-spacing:.6px; font-variant-numeric:tabular-nums;}
.wd-w .rd{border:1.5px solid rgba(148,163,184,.4);}
.wd-w.active{border-color:var(--primary); background:rgba(16,185,129,.06); box-shadow:0 0 0 3px rgba(16,185,129,.10);}
.wd-w.active .rd{background:var(--primary); border-color:var(--primary); color:#FFFFFF; box-shadow:none;}
.wd-w.add{border-style:dashed; border-color:rgba(148,163,184,.35);}
.wd-w.add .lg{color:var(--cyan); background:rgba(14,165,233,.08); border-color:rgba(14,165,233,.22);}

/* Error + main button */
.wd-err{margin:10px 2px 2px; font-size:12px; font-weight:600; color:var(--danger);}
.btn.wd-cta,#wd-overlay .btn.dep-cta{position:relative; width:100%; min-height:52px; margin-top:6px; border-radius:14px !important; font-weight:700; font-size:15px; letter-spacing:.1px;
  color:#FFFFFF; border:none !important; background:var(--primary) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -10px rgba(16,185,129,.55) !important; transition:background .15s,transform .12s,box-shadow .15s;}
.btn.wd-cta:hover,#wd-overlay .btn.dep-cta:hover{background:var(--primary-2) !important;}
.btn.wd-cta:active,#wd-overlay .btn.dep-cta:active{transform:scale(.985);}
.btn.wd-cta:disabled{color:var(--text-dim); background:rgba(148,163,184,.10) !important; border:1px solid rgba(148,163,184,.18) !important; box-shadow:none !important; cursor:not-allowed;}
.btn.wd-cta span{display:inline-flex; align-items:center;}
.wd-secure{margin-top:12px; font-size:11.5px; color:var(--text-mute);}
.wd-secure svg{color:var(--text-mute);}

/* History */
.wd-sec{margin:24px 2px 12px;}
.wd-sec h3{font-size:15px; font-weight:700; letter-spacing:0;}
.wd-sec h3::before{display:none;}
.wd-count{padding:4px 10px; font-weight:600; color:var(--text-2); background:rgba(148,163,184,.10); border:1px solid rgba(148,163,184,.2);}
.wd-h{padding:12px 13px; border-radius:14px; background:var(--surface); border:1px solid var(--border);}
.wd-h .ic{width:40px; height:40px; border-radius:12px; color:var(--text-2); background:rgba(148,163,184,.10); border:1px solid rgba(148,163,184,.2);}
.wd-h .bd b{font-weight:700; font-variant-numeric:tabular-nums;}
.wd-st{padding:5px 10px; border-radius:8px; font-weight:600;}
.wd-empty{border-radius:16px; background:transparent; border:1px dashed rgba(148,163,184,.28);}

/* Review sheet */
#wd-overlay .sheet{background:var(--surface) !important; border-top:1px solid rgba(148,163,184,.2) !important; border-radius:22px 22px 0 0; box-shadow:0 -16px 40px rgba(15,23,42,.1) !important;}
.wd-rv h3{font-size:18px; font-weight:700; letter-spacing:-.1px;}
.wd-rv-big{margin:16px 0 12px; padding:16px; border-radius:16px; background:rgba(16,185,129,.06); border:1px solid rgba(16,185,129,.28);}
.wd-rv-big small{font-weight:600; letter-spacing:.06em;}
.wd-rv-big b{margin-top:8px; font-size:32px; font-weight:800; letter-spacing:-.8px; font-variant-numeric:tabular-nums;}
.wd-rv-rows{border-radius:14px; background:rgba(148,163,184,.05); border:1px solid rgba(148,163,184,.12);}
.wd-rv-rows b{font-weight:700;}
.wd-rv-warn{border-radius:14px; background:rgba(148,163,184,.06); border:1px solid rgba(148,163,184,.16);}
.wd-rv-warn svg{color:var(--text-mute);}
#wd-overlay .btn.dep-back{min-height:46px; border-radius:14px !important; font-weight:600; color:var(--text-2); background:transparent; border:1px solid rgba(148,163,184,.22);}

  }

  /* ---------- state + render loop (3D tilt, sheen, particles) ---------- */
  const sprite=c=>{const k=document.createElement('canvas');k.width=k.height=48;const g=k.getContext('2d'),r=g.createRadialGradient(24,24,0,24,24,24);
    r.addColorStop(0,'#ffffff');r.addColorStop(.22,c+'dd');r.addColorStop(.55,c+'33');r.addColorStop(1,c+'00');g.fillStyle=r;g.fillRect(0,0,48,48);return k};
  const SG=sprite('#00EFA3'),SB=sprite('#18C8FF');
  let S,Q=[],tar={x:0,y:0},cur={x:0,y:0},run=false,going=false,outDone=false;
  const fresh=()=>({sx:0,lift:0,sc:1,col:0,cx:0,cy:0});
  S=fresh();
  stage.addEventListener('pointermove',e=>{const w=innerWidth,h=innerHeight;tar.x=((e.clientX/w)-.5)*2;tar.y=((e.clientY/h)-.5)*2});
  stage.addEventListener('pointerleave',()=>{tar.x=tar.y=0});

  function frame(t){
    if(!run)return;
    try{
      cur.x+=(tar.x-cur.x)*.07;cur.y+=(tar.y-cur.y)*.07;
      const k=RM?0:1,ry=cur.x*11+k*Math.sin(t/1900)*3.4,rx=-cur.y*8+k*Math.sin(t/1400)*2.2;
      tilt.style.transform='scale('+S.sc+') translateZ('+(S.lift*70)+'px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
      // sheen follows tilt + scripted sweeps
      card.style.setProperty('--sx',(.5+ry/36+S.sx*1.2-.6).toFixed(3));
      gsh.style.transform='translateX('+(-ry*1.6)+'px)';

      const w=cv.clientWidth,h=cv.clientHeight;

  function reset(){

    [dot,rg1,rg2].forEach(e=>e.classList.remove('go'));bye.classList.remove('show');byeh.innerHTML='';

    const n=getName();nm.textContent=n||'Member';
    // headline words (name gets the gradient)
    let i=0;const word=(t,g)=>'<span class="w'+(g?' g':'')+'" style="--i:'+(i++)+'">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';
    byeh.innerHTML='<span class="ln">'+word('See')+' '+word('you')+' '+word('soon'+(n?',':''))+'</span>'+(n?'<span class="ln">'+n.split(/\s+/).map(x=>word(x,1)).join(' ')+'</span>':'');

  // real logout of the site (Firebase sign-out + back to the login screen)
  const doLogout=()=>{if(outDone)return Promise.resolve();outDone=true;try{return Promise.resolve(typeof window.logout==='function'?window.logout():0).catch(e=>console.warn(e))}catch(e){console.warn(e);return Promise.resolve()}};

      tw(1250*T,p=>S.sx=p,smooth);scrambleTo(code,hexs(),950*T);tw(1000*T,p=>setPb(p*.34));
      await wait(1350*T);
      // 2 — encrypt (key gets masked)
      swap(st,'Encrypting your data');tick();buzz(8);
      scrambleTo(code,'•••• •••• •••• ••••',1050*T);tw(1000*T,p=>setPb(.34+p*.33));
      await wait(1350*T);
      // 3 — seal: card flips and lifts
      swap(st,'Sealing your session');tick();buzz(8);
      tw(900*T,p=>setPb(.67+p*.33));
      await wait(300*T);
      swoosh();flip.classList.add('f');tw(1000*T,(e,p)=>S.lift=Math.sin(p*Math.PI),t=>t);
      await wait(1000*T);
      stage.classList.add('locked');click();buzz(16);
      await wait(RM?60:360);
      stage.classList.add('ok');swap(st,'Session sealed');
      await wait(950*T);
      // 4 — the card dissolves into a single point of light
      under.classList.add('gone');gsh.style.opacity='0';burst();suck();
      await tw(900*T,(e,p)=>{S.sc=1-.9*e;S.col=p;
        const fo=Math.max(0,(p-.5)/.5);faces.forEach(f=>{f.style.opacity=(1-fo).toFixed(3);f.style.filter='blur('+(e*5).toFixed(2)+'px) brightness('+(1+e*1.4).toFixed(2)+')'})},t=>t);
      S.col=1;Q=[];
      dot.style.left=rg1.style.left=rg2.style.left=S.cx+'px';dot.style.top=rg1.style.top=rg2.style.top=S.cy+'px';
      void dot.offsetWidth;[dot,rg1,rg2].forEach(e=>e.classList.add('go'));

      const lp=doLogout();
      document.dispatchEvent(new CustomEvent('robot-logout:done'));
      await wait(380*T);bye.classList.add('show');
      if(CONFIG.redirect){await wait(2400);location.href=CONFIG.redirect;return}
      await wait(2300*T);await Promise.race([lp,wait(2500)]);
      stage.classList.remove('on');await wait(750);
      root.classList.remove('rlo-lock');run=false;
    }catch(e){console.error(e);doLogout();stage.classList.remove('on');root.classList.remove('rlo-lock');run=false}
    finally{going=false}
  }

  /* ---------- confirm sheet ---------- */
  const modal=$('#modal');
  const openM=()=>{modal.classList.add('show');$('#yes').focus()},closeM=()=>modal.classList.remove('show');
  $('#no').onclick=closeM;
  modal.onclick=e=>{if(e.target===modal)closeM()};
  addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
  $('#yes').onclick=()=>{closeM();play()};
  window.robotLogoutConfirm=()=>{if(!run&&!going)openM()};
  window.robotLogout=()=>{if(!run)play()};
})();
</script>

<script>
(function(){
  if(window.__pliReady)return;window.__pliReady=1;
  const host=document.createElement('div');host.id='pli-host';document.body.appendChild(host);
  const R=host.attachShadow({mode:'open'});

#pli-wrap{position:fixed;inset:0;z-index:20;background:#020817;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s,visibility .45s}
#pli-wrap.on{opacity:1;visibility:visible;pointer-events:auto}

  var ARRIVE=4.7, CYCLE=6.6;
  var W=0,H=0,dpr=1,S=[],RG=[],last=0,cycleStart=0,running=false,raf=null;

  function sm(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
  function speed(t){var g=sm(0,4.2,t);return (.12+g*g*6.2)*(1-sm(4.35,5.3,t)*.94);}

  function spawn(p,far){
    var a=Math.random()*6.2832,r=.05+Math.pow(Math.random(),.7)*1.25;
    p.x=Math.cos(a)*r;p.y=Math.sin(a)*r;
    p.z=far?1.6:.05+Math.random()*1.55;
    p.c=Math.random()<.22?CYAN:GREEN;

  }
  function seed(){
    var n=W<700?190:280,i;S=[];RG=[];
    for(i=0;i<n;i++){var p={};spawn(p,false);S.push(p);}
    for(i=0;i<7;i++)RG.push({z:.2+i*.23});
  }
  function size(){

    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);

  function frame(t,dt){
    var go=sm(0,4.2,t),sp=speed(t);
    var arrive=Math.exp(-Math.pow((t-ARRIVE)/.22,2));
    var calm=sm(5.0,5.9,t),live=sm(0,.7,t)*(1-sm(6.0,6.55,t));

    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';

    var gr=Math.max(W,H)*(.16+.3*go+.25*arrive);

    g.addColorStop(.35,'rgba('+GREEN+','+(.07*go*live)+')');
    g.addColorStop(1,'rgba('+GREEN+',0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    for(i=0;i<RG.length;i++){
      var rg=RG[i];rg.z-=sp*dt*.5;
      if(rg.z<.06)rg.z+=1.6;

      var ox=Math.sin(t*.8+rg.z*2.2)*W*.04*spn,oy=Math.cos(t*.6+rg.z*1.7)*H*.025*spn;
      var al=Math.min(1,(1.6-rg.z)*2.2)*Math.min(1,rg.z*6)*(.06+.26*spn)*live;

    }

      var fg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.9);
      fg.addColorStop(0,'rgba(255,255,255,'+(.6*arrive)+')');

      var len=A.sampleRate*2,buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);

      var bp=A.createBiquadFilter();bp.type='bandpass';bp.Q.value=.9;
      var ng=A.createGain();

      ng.gain.setValueCurveAtTime(curve(function(s,t){return (.02+.3*s)*sm(0,.5,t);}),T,D);

      ns.start(T);ns.stop(T+6.5);

      var b=A.createOscillator();b.type='sine';

      var ns2=A.createBufferSource();ns2.buffer=buf;ns2.loop=true;

  // Public API used by doLogin(): plays automatically (no "শুরু করো" button,
  // no click needed inside this component — starting it IS the click on

  window.playLoginIntro = function(){

  };
})();

:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}

@keyframes apx-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

const E = s => esc(s==null?'':s);
const usedToday = id => S.usedDate===today() ? Number(S.used[id]||0) : 0;
const MAIL = '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>';

};

/* ============ ⋯ menu: upcoming jobs + site rules ============ */
const MM_JOBS = [
  {id:'micro',  name:'Micro Job',     desc:'Quick tasks, quick rewards',        c:'#10B981', c2:'#059669', ic:'<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>'},
  {id:'prime',  name:'Prime Job',     desc:'Premium job opportunities',  c:'#E6A83C', c2:'#C98516', ic:'<path d="M3 7l4 4 5-7 5 7 4-4-2 11H5L3 7z"/>'},
  {id:'affil',  name:'Affiliate Job', desc:'Partner & affiliate opportunities', c:'#5B8DEF', c2:'#3A67D0', ic:'<circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8l7.4-3.6M8.3 13.2l7.4 3.6"/>'}

const DEFAULT_SITE_RULES =
`# স্বাগতম
এই সাইটটি মূলত একটি ফ্রি সাইট।

# ডিপোজিট সংক্রান্ত
- ডিপোজিট করে কাজ করতে চাইলে সেটা সম্পূর্ণ আপনার নিজের দায়িত্বে করবেন।

ধন্যবাদ।`;
function mmIcon(p,sz,w){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`; }
function mmLayer(id, html, label){
  mmRemove(id);
  const el = document.createElement('div');
  el.id = id; el.className = 'mm-layer'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label', label||'');
  el.innerHTML = html;
  el.addEventListener('click', e=>{ if(e.target===el) mmClose(id); });
  document.body.appendChild(el);
  document.body.classList.add('mm-lock');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  return el;
}
function mmRemove(id){ const o = document.getElementById(id); if(o) o.remove(); if(!document.querySelector('.mm-layer')) document.body.classList.remove('mm-lock'); }
function mmClose(id){
  const el = document.getElementById(id); if(!el) return;
  el.classList.remove('show');
  setTimeout(()=>{ mmRemove(id); }, 260);
}
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  const layers = document.querySelectorAll('.mm-layer'); if(!layers.length) return;
  mmClose(layers[layers.length-1].id);
});
window.mmClose = mmClose;
window.openMoreMenu = function(){

        <button type="button" class="mm-x" aria-label="Close" onclick="mmClose('mm-menu')">${mmIcon('<path d="M6 6l12 12M18 6L6 18"/>',18,2.6)}</button></div>
      <div class="mm-jobs">${jobs}</div>
      <button type="button" class="mm-rules" onclick="openSiteRules()">
        <span class="mm-rules-ic">${mmIcon('<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>',24,2)}</span>
        <span class="mm-rules-t"><b>Rules</b><small>Read the rules of this site</small></span>
        ${mmIcon('<path d="M9 6l6 6-6 6"/>',20,2.4)}
      </button>
    </div>`, 'More');
  const x = el.querySelector('.mm-x'); if(x) try{ x.focus({preventScroll:true}); }catch(_){}
};
window.openComingSoon = function(id){
  const j = MM_JOBS.find(x=>x.id===id); if(!j) return;
  mmLayer('mm-soon', `<div class="mm-soon-card" style="--c:${j.c};--c2:${j.c2}">
      <div class="mm-soon-ic">${mmIcon(j.ic,34,2)}</div>

      <p>We're working hard to bring this to you. Stay tuned — it will be available very soon.</p>
      <button type="button" class="mm-soon-btn" onclick="mmClose('mm-soon')">Got it</button>
    </div>`, j.name+' coming soon');
};
function mmRulesHTML(txt){
  let out = '', list = false;
  const closeList = ()=>{ if(list){ out += '</ul>'; list = false; } };
  String(txt||'').split(/\r?\n/).forEach(raw=>{
    const l = raw.trim();
    if(!l){ closeList(); return; }
    if(l.indexOf('# ')===0){ closeList(); out += `<h4>${esc(l.slice(2))}</h4>`; }
    else if(/^[-•*]\s+/.test(l)){ if(!list){ out += '<ul>'; list = true; } out += `<li><i>${mmIcon('<path d="M5 12.5l4.5 4.5L19 7.5"/>',13,2.8)}</i><span>${esc(l.replace(/^[-•*]\s+/,''))}</span></li>`; }
    else { closeList(); out += `<p>${esc(l)}</p>`; }
  });
  closeList();
  return out;
}
window.openSiteRules = function(){
  const st = firebaseSettings || {};
  const title = (st.siteRulesTitle||'').trim() || DEFAULT_SITE_RULES_TITLE;
  const body = (st.siteRules||'').trim() || DEFAULT_SITE_RULES;
  mmClose('mm-menu');
  mmLayer('mm-rules', `<div class="mm-sheet mm-tall">

        <small>RULES</small><h3>${esc(title)}</h3><div class="mm-rdiv"></div>

      <button type="button" class="mm-soon-btn mm-ok" onclick="mmClose('mm-rules')">I understand</button>
    </div>`, title);
};

// Unlimited Gmail packages: cheapest first, then the admin's order number, then oldest
const svcCmp = (a,b)=>(Number(a.price||0)-Number(b.price||0)) || (Number(a.order||0)-Number(b.order||0)) || (tms(a)-tms(b));
const DAY_MS = 864e5;
const svValid = sv => Math.max(0, Math.floor(Number(sv && sv.validityDays) || 0));
const validLabel = d => d>0 ? (d===1 ? '1 day' : d+' days') : 'Lifetime';
const pExp = p => { const x = Number(p && p.expiresAt); return x>0 ? x : 0; };   // 0 = no expiry (lifetime)
const pActive = p => p.status==='approved' && (!pExp(p) || pExp(p) > Date.now());
const fmtDate = ms => new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function activePurchase(sv){
  const mine = S.purchases.filter(p=>p.serviceId===sv.id && pActive(p));
  return mine.length ? mine.sort((a,b)=>(pExp(b)||9e15)-(pExp(a)||9e15))[0] : null;
}
function purchaseState(sv){
  if(isFree(sv)) return 'unlocked';
  const mine = S.purchases.filter(p=>p.serviceId===sv.id);
  if(mine.some(pActive)) return 'unlocked';
  if(mine.some(p=>p.status==='pending')) return 'pending';
  if(mine.some(p=>p.status==='approved')) return 'expired';   // was unlocked, validity ended
  if(mine.length) return 'rejected';
  return 'none';
}

/* ---------------- data ---------------- */
async function boot(force){
  S.loading = true; S.failed = false;
  const ctx = await ensureReady();
  if(!ctx){ S.loading=false; S.failed=true; render(); return; }
  const {fb, user} = ctx; S.uid = user.uid;
  let anyFail = false;
  // Everything below is served from the short-lived read cache when fresh;
  // the Retry button (force) always goes to the server.
  try{
    S.services = await rcLoad('gm_services', RC_TTL.gmSvc, !!force, async()=>{
      const sn = await fb.getDocs(fb.collection(fb.db,'gmailServices'));
      return sn.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.active!==false)
        .sort(svcCmp);
    }, true);
    S.services = (S.services||[]).slice().sort(svcCmp);   // also fixes an older saved copy that was ordered differently
  }catch(e){ console.warn('gmail services', e); anyFail = true; S.services = []; }
  try{
    const loadPurch = async()=>{
      const sn = await fb.getDocs(fb.query(fb.collection(fb.db,'gmailPurchases'), fb.where('uid','==',S.uid)));
      return sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));
    };
    S.purchases = await rcLoad('gm_purchases', RC_TTL.mine, !!force, loadPurch);
    // A payment still "pending" in the saved copy may already be approved by the admin:
    // re-check it from the server (only for members who have a pending payment).
    if(!force && S.purchases.some(p=>p.status==='pending')){
      S.purchases = await rcLoad('gm_purchases', RC_TTL.mine, true, loadPurch);
    }
  }catch(e){ console.warn('gmail purchases', e); S.purchases = []; }
  await loadSales(fb, !!force);
  // "Password to use" is already in memory from the account-services load; read only if missing
  const svGm = state.sellServices && state.sellServices.gmail;
  if(svGm){ S.lockPw = String(svGm.requiredPassword||''); }
  else{
    try{
      S.lockPw = await rcLoad('gm_lockpw', RC_TTL.shared, !!force, async()=>{
        const g = await fb.getDoc(fb.doc(fb.db,'accountServices','gmail'));
        return g.exists() ? String(g.data().requiredPassword||'') : '';
      }, true);
    }catch(e){ console.warn('gmail required password', e); S.lockPw = ''; }
  }
  // today's usage: the user document was already read at login (re-checked from the server on Submit)
  const g = (state.user && state.user.gmailDaily) || {};
  S.used = g.counts||{}; S.usedDate = g.date||''; S.freeUsed = Number(g.free||0);
  S.loading = false; S.failed = anyFail && !S.services.length;
  render();
}
async function loadSales(fb, force){
  try{
    S.sales = await rcLoad('gm_sales', RC_TTL.notifs, !!force, async()=>{
      const sn = await fb.getDocs(fb.query(fb.collection(fb.db,'gmailSales'), fb.where('uid','==',S.uid)));
      return sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));
    });
  }catch(e){ console.warn('gmail sales', e); S.sales = []; }
}

/* ---------------- rendering ---------------- */
function root(){ return $('gm-root'); }
function render(){
  const r = root(); if(!r) return;
  const pend = S.sales.filter(x=>x.status==='pending').length;
  let body = '';
  if(S.loading) body = `<div class="gm-wait"><div class="gm-ring"></div><b>Loading</b><p>Getting your services…</p></div>`;
  else if(S.failed) body = `<div class="gm-empty"><div class="ei">${ic('info',24)}</div><b>Couldn't load services</b>Check your connection and try again.<br><button class="gm-cta ghost" style="margin-top:16px" onclick="gmReload()">Retry</button></div>`;
  else if(S.tab==='sales') body = salesView();
  else if(S.view==='form') body = formView();
  else if(S.view==='wait') body = waitView();
  else if(S.view==='result') body = resultView();
  else body = listView();
  const hideTabs = !S.loading && !S.failed && S.tab==='create' && (S.view==='wait' || S.view==='result');
  r.innerHTML = `
    <div class="gm-hero"><div class="gm-hero-ic">${ic('mail',24)}</div><div class="gm-hero-t"><b class="gm-title">Unlimited Gmail</b><span class="gm-sub">Register accounts, sell them, get paid.</span></div></div>
    ${(S.loading||S.failed||hideTabs)?'':gmBalCard()}
    ${hideTabs ? '' : `<div class="gm-tabs" role="tablist">
      <button role="tab" aria-selected="${S.tab==='create'}" class="${S.tab==='create'?'on':''}" onclick="gmTab('create')">${ic('plus',16)}Register</button>
      <button role="tab" aria-selected="${S.tab==='sales'}" class="${S.tab==='sales'?'on':''}" onclick="gmTab('sales')">${ic('trend',16)}Sales${pend?`<i>${pend}</i>`:''}</button>
    </div>`}
    ${body}`;
}

function listView(){
  const fc = freeCard();

  const CK = icon('<path d="M5 12.5l4.5 4.5L19 7.5"/>',13);
  const paidIds = S.services.filter(x=>!isFree(x)).map(x=>x.id);
  const feat = (t,sub)=>`<li><i>${CK}</i><span><b>${t}</b><small>${sub}</small></span></li>`;
  const idxOf = sv => S.services.indexOf(sv);
  return `<div class="gm-sec-h"><h2>Choose your package</h2><p>Packages are listed from the lowest price to the highest. Pick one and start earning.</p></div><div class="gm-list">${fc}${S.services.map(sv=>{
    const st = purchaseState(sv), free = isFree(sv);
    const rank = free ? -1 : paidIds.indexOf(sv.id), tier = free ? 'f' : Math.min(Math.max(rank,0),3), lowest = !free && rank===0 && paidIds.length>1;
    const lim = Number(sv.dailyLimit||0), used = usedToday(sv.id), left = Math.max(0, lim-used);
    const vd = svValid(sv);
    const ap = (st==='unlocked' && !free) ? activePurchase(sv) : null;
    const exp = ap ? pExp(ap) : 0;
    const daysLeft = exp ? Math.max(0, Math.ceil((exp-Date.now())/DAY_MS)) : 0;
    const total = (ap && Number(ap.validityDays)) || vd;
    const pct = exp && total ? Math.max(4, Math.min(100, daysLeft/total*100)) : 100;
    const lastExp = st==='expired' ? Math.max(0, ...S.purchases.filter(p=>p.serviceId===sv.id && p.status==='approved').map(pExp)) : 0;
    let cta;
    if(st==='unlocked') cta = left>0
      ? `<button class="gm-cta" onclick="gmOpen('${E(sv.id)}')">${free?'Start now':'Open'} ${ic('arrow',18)}</button>`
      : `<button class="gm-cta ghost" disabled>Daily limit reached</button>`;
    else if(st==='pending') cta = `<button class="gm-cta ghost" disabled>Payment under review</button>`;
    else if(st==='expired') cta = `<button class="gm-cta pay" onclick="gmPay('${E(sv.id)}')">Renew · ${money(sv.price)}</button>`;
    else cta = `<button class="gm-cta pay" onclick="gmPay('${E(sv.id)}')">Pay ${money(sv.price)} to unlock</button>`;
    const note = st==='rejected' ? `<div class="gm-note bad">Your last payment couldn't be verified. Please pay again.</div>`

    const perDay = (vd>0 && Number(sv.price)>0) ? ` <i class="perday">≈ ${money(Math.ceil(Number(sv.price)/vd))} / day</i>` : '';
    const priceBlock = (!free && st!=='unlocked') ? `<div class="gm-pkg-price"><div><span>Package price</span><b>${money(sv.price)}<small>${vd>0?' / '+validLabel(vd):' · one time'}</small></b>${perDay}</div></div>` : '';

        <div class="h"><span>${exp?'Valid until':'Access'}</span><b>${exp?fmtDate(exp):'Lifetime'}</b></div>

      ${lowest?'<div class="gm-pkg-ribbon">LOWEST PRICE</div>':''}
      <div class="gm-svc-top">
        <div class="gm-svc-ic">${ic('mail',20)}</div>
        <div class="t"><span class="gm-pkg-tier">${free?'FREE PLAN':'PREMIUM PLAN'}</span><b>${E(sv.name)}</b><small>${st==='unlocked'?`${left} left today`:`Up to ${lim} Gmail per day`}</small></div>
        <span class="gm-badge ${badge[0]}">${badge[1]}</span>
      </div>
      ${priceBlock}${validBlock}
      <div class="gm-pkg-earn"><span>Max daily earning</span><b>${money(lim*Number(sv.rate||0))}</b></div>
      <ul class="gm-pkg-feat">
        ${feat(lim+' per day','Daily Gmail limit')}
        ${feat(money(sv.rate),'Earning per Gmail')}
        ${feat(validLabel(vd),'Package validity')}
        ${feat(isMasked(sv)?'Hidden':'Visible','Gmail username')}
      </ul>
      ${st==='unlocked' ? `<div class="gm-usage"><div class="gm-usage-h"><span>Today's usage</span><b>${used} / ${lim}</b></div><div class="gm-bar"><i style="width:${lim?Math.min(100,used/lim*100):0}%"></i></div></div>` : ''}
      ${cta}${note}

  }).join('')}</div>`;
}

    ov.setAttribute('role','alertdialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-labelledby','apx-cf-t');
    ov.innerHTML = `<div class="apx-cf-card">
      <div class="apx-cf-ic ${o.danger?'danger':''}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
      <h3 id="apx-cf-t">${esc(o.title||'Are you sure?')}</h3>
      ${o.text?`<p>${esc(o.text)}</p>`:''}
      <div class="apx-cf-btns"><button type="button" class="apx-cf-no">${esc(o.cancel||'Cancel')}</button><button type="button" class="apx-cf-yes ${o.danger?'danger':''}">${esc(o.ok||'Confirm')}</button></div>
    </div>`;
    const done = v => { document.removeEventListener('keydown', key); ov.classList.remove('show'); setTimeout(()=>ov.remove(),220); res(v); };
    const key = e => { if(e.key==='Escape') done(false); };
    ov.addEventListener('click', e => { if(e.target===ov) done(false); });
    ov.querySelector('.apx-cf-no').onclick = ()=>done(false);
    ov.querySelector('.apx-cf-yes').onclick = ()=>done(true);
    document.addEventListener('keydown', key);
    document.body.appendChild(ov);
    requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('show')));
    try{ ov.querySelector('.apx-cf-no').focus({preventScroll:true}); }catch(_){}
  });
};
window.gmAgain = async ()=>{
  if(SECRET){
    const ok = await apxConfirm({title:'Discard this account?', text:'It will be lost and cannot be sold later.', ok:'Discard', cancel:'Keep it', danger:true});
    if(!ok) return;
  }
  SECRET=null; S.free=false; S.view='list'; render();
};

function setErr(m){ const e=$('gm-err'); if(e) e.textContent=m||''; }
window.gmSubmit = async function(btn){
  const sv = S.svc; if(!sv) return;
  let first=$('gm-fn').value.trim(), last=$('gm-ln').value.trim(), age=$('gm-age').value.trim(), dob=$('gm-dob').value, pw=$('gm-pw').value;
  const lk = lockedPw(sv); if(lk) pw = lk;   // enforce the locked password even if the field was tampered with
  S.form = {first,last,age,dob,password:pw};
  if(first.length<2) return setErr('Enter your first name');
  if(last.length<2) return setErr('Enter your last name');
  if(!S.gender) return setErr('Select a gender');
  const a = Number(age);
  if(!age || !Number.isInteger(a) || a<13 || a>100) return setErr('Enter a valid age (13–100)');
  if(!dob || isNaN(new Date(dob).getTime()) || new Date(dob) > new Date()) return setErr('Select a valid date of birth');
  if(!lk && pw.length<8) return setErr('Password must be at least 8 characters');
  setErr('');
  if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.disabled=true; btn.innerHTML='<span class="gm-spin"></span>';
  const reset = ()=>{ btn.dataset.busy='0'; btn.disabled=false; btn.textContent='Submit'; };

  const ctx = await ensureReady(); if(!ctx){ reset(); return setErr('Check your internet connection and try again'); }
  const {fb} = ctx;
  try{   // re-check today's usage from the server so the daily limit can't be dodged
    const u = await fb.getDoc(fb.doc(fb.db,'users',S.uid)); const g = u.exists()?(u.data().gmailDaily||{}):{};
    S.used = g.counts||{}; S.usedDate = g.date||''; S.freeUsed = Number(g.free||0);
    if(S.free) await loadFirebaseSettings(true);      // admin may have changed the free quota
  }catch(e){ console.warn(e); }
  if(S.free){
    if(freeLeft() <= 0){ reset(); S.free=false; S.view='list'; render(); toast('Your free accounts are used up'); return; }
  } else if(usedToday(sv.id) >= Number(sv.dailyLimit||0)){ reset(); setErr('Daily limit reached for this service'); return; }

  const token = ++S.run, total = Math.max(0, Number(sv.delaySec??55))*1000, t0 = Date.now();
  S.view='wait'; render(); window.scrollTo(0,0);
  const msgs = ['Checking name availability…','Preparing your account…','Securing the password…','Finalizing…'];
  await new Promise(res=>{
    if(total===0) return res();
    const iv = setInterval(()=>{
      if(token!==S.run || !root()){ clearInterval(iv); return res(); }
      const el = Date.now()-t0, p = Math.min(1, el/total);
      const bar=$('gm-w-bar'), sec=$('gm-w-sec'), msg=$('gm-w-msg');
      if(bar) bar.style.width=(p*100)+'%';
      if(sec) sec.textContent=Math.max(0, Math.ceil((total-el)/1000));
      const si = Math.min(msgs.length-1, Math.floor(p*msgs.length));
      if(msg) msg.textContent=msgs[si];
      const stp=$('gm-w-stp'); if(stp) Array.prototype.forEach.call(stp.children,(li,k)=>{ const c = k<si?'done':(k===si?'on':''); if(li.className!==c) li.className=c; });
      if(p>=1){ clearInterval(iv); res(); }
    }, 250);
  });
  if(token!==S.run || !root()) return;          // user left — nothing is consumed

  // build the address (kept private in the closure)
  let local = (first+last).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,20) || 'user';
  local += String(Math.floor(100+Math.random()*900));
  try{
    const date = today();
    let counts = (S.usedDate===date) ? {...S.used} : {}, freeN = Number(S.freeUsed||0);
    if(S.free) freeN += 1; else counts[sv.id] = (counts[sv.id]||0)+1;
    // 'free' lives inside the existing gmailDaily map, so no new field is needed
    const daily = {date, counts}; if(freeN>0) daily.free = freeN;     // 'free' only appears once used
    await fb.rpc('app_gmail_daily', {p_daily:daily});
    S.used = counts; S.usedDate = date; S.freeUsed = freeN;
    state.user.gmailDaily = daily;
  }catch(e){
    console.error(e); toast("Couldn't create the account. Please try again");
    S.view='form'; render(); return;
  }
  SECRET = {local, domain:(sv.domain||'gmail.com'), password:pw, first, last, gender:S.gender, age:a, dob};
  S.view='result'; render(); window.scrollTo(0,0);
};

window.gmSell = async function(btn){
  const sv=S.svc, d=SECRET; if(!sv || !d) return;
  if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.disabled=true; btn.innerHTML='<span class="gm-spin"></span>';
  const ctx = await ensureReady();
  if(!ctx){ btn.dataset.busy='0'; btn.disabled=false; btn.textContent='Sell · '+money(curRate(sv)); toast('Check your internet connection'); return; }
  const {fb} = ctx;
  try{
    await fb.addDoc(fb.collection(fb.db,'gmailSales'), {
      uid:S.uid, userName:state.user.name||'', userPhone:state.user.phone||'',
      serviceId:sv.id, serviceName:sv.name, rate:curRate(sv),
      email:d.local+'@'+d.domain, domain:d.domain, masked:isMasked(sv), password:d.password,
      firstName:d.first, lastName:d.last, gender:d.gender, age:d.age, dob:d.dob,
      status:'pending', createdAt:fb.serverTimestamp(),
      ...(S.free ? {free:true} : {})
    });
    SECRET=null; S.free=false; S.view='list'; S.tab='sales';
    await loadSales(fb, true); render(); window.scrollTo(0,0);
    toast('Submitted for review');
  }catch(e){
    console.error(e); btn.dataset.busy='0'; btn.disabled=false; btn.textContent='Sell · '+money(curRate(sv));
    toast("Couldn't submit. Please try again");
  }
};

/* ---------------- payment sheet (bKash / Nagad) ---------------- */
function paySheet(){
  const sv = S.pay.sv, m = S.pay.method, num = getDepositNumber(m), cls = m==='bKash' ? 'bk' : 'ng';
  const cp = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>';
  return `
    <div class="sheet-handle"></div>
    <button class="gm-x" aria-label="Close" onclick="gmPayClose()">${ic('close',16)}</button>
    <h3>Unlock ${E(sv.name)}</h3>
    <p class="lead">${svValid(sv)>0 ? `Valid for ${validLabel(svValid(sv))} from approval. The service opens as soon as we verify your payment.` : `One-time payment with lifetime access. The service opens as soon as we verify it.`}</p>
    <div class="gm-amt"><span>Amount to pay</span><b>${money(sv.price)}</b></div>
    <span class="gm-lbl">Payment method</span>
    <div class="gm-meth">
      ${[['bKash','bk'],['Nagad','ng']].map(([x,c])=>`<button type="button" class="${c} ${m===x?'on':''}" onclick="gmPayMethod('${x}')"><span class="lg">${depLogo(x)}</span><span><b>${x}</b><small>Send Money</small></span></button>`).join('')}
    </div>
    <div class="gm-num ${cls}">
      <small>${m} number</small>
      <div class="gm-num-row"><b>${E(num)}</b><button type="button" class="gm-copy" onclick="gmCopyNum('${E(num)}',this)">${cp}<span>Copy</span></button></div>
    </div>
    <div class="gm-hint">Use <b>Send Money</b> only. Payments sent via “Payment” or “Cash Out” can’t be verified.</div>
    <ol class="gm-steps">
      <li><span>Open <b>${m}</b> and choose <b>Send Money</b>.</span></li>
      <li><span>Send exactly <b>${money(sv.price)}</b> to the number above.</span></li>
      <li><span>Paste the <b>Transaction ID</b> below and submit.</span></li>
    </ol>
    <div class="gm-f"><label for="gm-trx">Transaction ID</label>
      <div class="gm-txw"><input class="gm-in" id="gm-trx" maxlength="80" autocomplete="off" autocapitalize="characters" placeholder="Enter Transaction ID"><button type="button" onclick="gmPaste()">Paste</button></div></div>
    <div class="gm-err" id="gm-perr" role="alert"></div>
    <button class="gm-cta pay" onclick="gmPaySubmit(this)">Submit payment</button>
    <div class="gm-note">${ic('lock',13)} Only enter the ID of a real transaction.</div>`;
}
function payRender(){
  let ov = $('gm-ov');
  if(!ov){
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    $('modal-root').insertAdjacentHTML('beforeend', `<div class="modal-overlay" id="gm-ov" onclick="if(event.target===this) gmPayClose()"><div class="sheet gm-sheet" id="gm-sh" style="position:relative"></div></div>`);
  }
  $('gm-sh').innerHTML = paySheet();
}
window.gmPay = id=>{
  const sv=S.services.find(x=>x.id===id); if(!sv) return;
  if(purchaseState(sv)==='pending'){ toast('Your payment is already under review'); return; }
  S.pay={sv, method:'bKash'}; payRender();
};
window.gmPayMethod = m=>{ const keep=$('gm-trx')?$('gm-trx').value:''; S.pay.method=m; payRender(); if($('gm-trx')) $('gm-trx').value=keep; };
window.gmPayClose = ()=>{ const ov=$('gm-ov'); if(ov) ov.remove(); S.pay=null; };
window.gmCopyNum = (n,b)=>{
  const lab=b.querySelector('span'), done=()=>{ toast('Number copied'); b.classList.add('done'); if(lab) lab.textContent='Copied'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('done'); if(lab) lab.textContent='Copy'; } },1500); };
  const fallback=()=>{ try{ const t=document.createElement('textarea'); t.value=n; t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); ok?done():toast('Press and hold to copy'); }catch(e){ toast('Press and hold to copy'); } };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(n).then(done).catch(fallback); else fallback();
};
window.gmPaste = async ()=>{ try{ const t=(await navigator.clipboard.readText()||'').trim(); if(t) $('gm-trx').value=t.slice(0,80); else toast('Clipboard is empty'); }catch(e){ toast('Long-press the field to paste'); } };
window.gmPaySubmit = async function(btn){
  const sv=S.pay && S.pay.sv; if(!sv) return;
  const trx = ($('gm-trx').value||'').trim(), perr=$('gm-perr');
  if(!trx){ perr.textContent='Enter the Transaction ID'; return; }
  perr.textContent='';
  if(btn.dataset.busy==='1') return; btn.dataset.busy='1'; btn.disabled=true; btn.innerHTML='<span class="gm-spin"></span>';
  const ctx = await ensureReady();
  if(!ctx){ btn.dataset.busy='0'; btn.disabled=false; btn.textContent='Submit payment'; perr.textContent='Check your internet connection and try again'; return; }
  const {fb} = ctx, method=S.pay.method;
  try{
    await fb.addDoc(fb.collection(fb.db,'gmailPurchases'), {
      uid:S.uid, userName:state.user.name||'', userPhone:state.user.phone||'',
      serviceId:sv.id, serviceName:sv.name, amount:Number(sv.price||0), method,
      receiverNumber:getDepositNumber(method), transactionId:trx, status:'pending', createdAt:fb.serverTimestamp()
    });
    const sn = await fb.getDocs(fb.query(fb.collection(fb.db,'gmailPurchases'), fb.where('uid','==',S.uid)));
    S.purchases = sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tms(b)-tms(a));
    RC.set('gm_purchases', S.purchases);
    gmPayClose(); render(); toast('Payment submitted — we will verify it shortly');
  }catch(e){
    console.error(e); btn.dataset.busy='0'; btn.disabled=false; btn.textContent='Submit payment';
    perr.textContent="Couldn't submit the payment. Please try again";
  }
};

renderers['gmail-create'] = function(){
  S.tab='create'; S.view='list'; S.run++; SECRET=null;
  setTimeout(boot, 0);
  return `<div class="gm-wrap" id="gm-root"></div>`;
};
